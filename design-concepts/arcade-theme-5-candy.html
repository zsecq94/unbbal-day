<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>운빨데이 — 어떤 재미에, 운이 끌리나요?</title>
<style>
@font-face{font-family:PD;src:url('assets/Pretendard-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:PD;src:url('assets/Pretendard-Bold.ttf') format('truetype');font-weight:700;font-display:swap}

/* ───────── 테마 토큰: 이 블록만 바꾸면 색·발광·재질 톤이 바뀐다 ───────── */
:root{
  color-scheme:dark;
  /* 공간 — 가지색 방, 분홍빛 공기 */
  --bg:#180a20;
  --bg-glow:#ff7cc83a;
  --surface-room:#22102d;
  --surface-floor:#2a1236;
  --surface-shadow:#0c0412;
  /* 기계 재질 — 광택 플라스틱과 펄 금속 */
  --surface-cabinet:#341846;
  --surface-cabinet-hi:#55306c;
  --surface-metal-hi:#ffe1f3;
  --surface-metal:#b98fd0;
  --surface-metal-lo:#4b2a60;
  --surface-warm:#7a3c62;
  --surface-glass:#2a1438;
  --surface-deep:#1b0a26;
  --surface-panel:#2b1440;
  --surface-panel-hi:#3a1d52;
  /* 선 */
  --line:#ffffff1c;
  --line-strong:#62407a;
  /* 글자 */
  --ink:#fff6fb;
  --ink-muted:#e6d0ea;
  --ink-subtle:#b997c6;
  --ink-on-accent:#2b0a28;
  --ball-ink:#3b1c32;
  --hl:#ffffff;
  /* 포인트 — 파스텔 네온 */
  --accent:#ff9ad6;
  --game-fortune:#c8a8ff;
  --game-lotto:#ffe96a;
  --game-pinball:#ff86cf;
  --game-ladder:#72f0c9;
  --game-wheel:#ffac66;
  --game-horse:#ff8f8c;
  --game-racing:#82d0ff;
  /* 빛과 그림자 */
  --glow-idle:.86;
  --glow-hot:1.12;
  --shadow-drop:0 20px 34px #0a0210b0;
  --shadow-contact:#0a0210dd;
  --radius-cabinet:22px;
  /* 캔디 팝 전용 */
  --gloss:#ffffff2e;
  --gloss-soft:#ffffff12;
  --radius-panel:14px;
}
/* ─────────────────────────────────────────────────────────────── */

@property --lit{syntax:'<number>';inherits:true;initial-value:.5}
@property --crown{syntax:'<number>';inherits:true;initial-value:.5}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);font-family:PD,'Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.025em;
  background:radial-gradient(ellipse 70% 55% at 50% 62%,var(--bg-glow),transparent 70%),var(--bg)}
body:before{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 65px,color-mix(in srgb,var(--ink) 1.2%,transparent) 66px 67px)}
button{font:inherit;color:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,p{margin:0}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

.shell{--row-h:clamp(430px,56vh,620px);--copy-h:186px;width:calc(100% - 128px);max-width:1792px;height:100vh;margin:0 auto;display:flex;flex-direction:column}

/* 헤더 */
.topbar{flex:none;height:clamp(72px,9vh,98px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;font-size:28px;font-weight:700;letter-spacing:-.065em}
.brand svg{width:37px;height:37px;color:var(--accent);filter:drop-shadow(0 0 8px color-mix(in srgb,var(--accent) 40%,transparent))}
.brand small{margin-left:10px;font-size:11px;font-weight:400;letter-spacing:.14em;color:var(--ink-subtle)}
.top-note{font-size:14px;color:var(--ink-muted);letter-spacing:-.01em}
.top-note span{color:var(--ink);margin-left:25px}

/* 인트로 */
.intro{flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:clamp(18px,3.1vh,40px) 0 clamp(16px,2.6vh,32px)}
.eyebrow{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--accent);letter-spacing:.02em}
.eyebrow:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.intro h1{font-size:clamp(38px,3.9vh,44px);font-weight:700;line-height:1.26;letter-spacing:-.055em;margin-top:10px}
.intro-copy{font-size:16px;line-height:1.8;color:var(--ink-muted);padding-bottom:3px}

/* 게임 공간 */
.arcade-room{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;margin:0 -24px;padding:0 24px;
  background:linear-gradient(180deg,var(--surface-room),transparent 72%)}
.arcade-room:before{content:'';position:absolute;left:9%;right:9%;top:0;height:2px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 60%,transparent),transparent);box-shadow:0 3px 25px 3px color-mix(in srgb,var(--accent) 10%,transparent)}
.room-labels{flex:none;display:flex;gap:18px;align-items:center;padding:clamp(14px,2.2vh,26px) 0 clamp(12px,2vh,24px);color:var(--ink-muted);font-size:13px;letter-spacing:.06em}
.room-labels span{display:flex;align-items:center;gap:10px}
.room-labels span:before{content:'';height:1px;width:24px;background:var(--line-strong)}
.room-labels .solo-label{width:calc((100% - 108px) / 7 * 2 + 18px)}

.cabinet-row{flex:none;height:var(--row-h);display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:18px;align-items:end;position:relative;z-index:2}
.floor{flex:1;min-height:104px;position:relative;margin:0 -24px;border-top:1px solid var(--line-strong);
  background:linear-gradient(180deg,color-mix(in srgb,var(--surface-floor) 100%,transparent),transparent 85%)}
.floor:before{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 22%,transparent),transparent)}

/* 기계 */
.game{--lit:calc(var(--tier) * var(--glow-idle));--crown:var(--lit);
  position:relative;appearance:none;background:none;border:0;padding:0;min-width:0;height:calc(var(--row-h) * var(--h));
  display:flex;flex-direction:column;transition:--lit .35s ease,--crown .35s ease,transform .25s ease}
.game:focus{outline:none}
.game:focus-visible{outline:2px solid var(--ink);outline-offset:6px;border-radius:6px}
.game:hover,.game:focus-visible{--lit:var(--glow-hot);transform:translateY(-4px)}
.cabinet-row:has(.game:hover) .game:not(:hover):not(:focus-visible),
.cabinet-row:has(.game:focus-visible) .game:not(:hover):not(:focus-visible){--lit:calc(var(--tier) * var(--glow-idle) * .5)}
.game[aria-pressed=true]{--crown:1}

.crown{flex:none;display:block;height:calc(var(--row-h) * var(--crown-h));color:var(--gc);position:relative;z-index:1}
.crown svg{display:block;width:100%;height:100%;overflow:visible}
.crown .cr-body{fill:var(--cab-flat);stroke:var(--line-strong);stroke-width:1;vector-effect:non-scaling-stroke}
.crown .cr-edge{fill:none;stroke:var(--surface-metal-hi);stroke-opacity:.45;stroke-width:1;vector-effect:non-scaling-stroke}
.crown .cr-deep{fill:var(--surface-deep)}
.neon-s{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;
  opacity:calc(.3 + var(--crown) * .7);filter:drop-shadow(0 0 calc(1px + var(--crown) * 5px) color-mix(in srgb,currentColor calc(var(--crown) * 90%),transparent))}
.neon-f{fill:currentColor;opacity:calc(.3 + var(--crown) * .7);filter:drop-shadow(0 0 calc(1px + var(--crown) * 5px) color-mix(in srgb,currentColor calc(var(--crown) * 90%),transparent))}

.cab{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;position:relative;padding:var(--frame);
  background:var(--cab-bg);border:1px solid var(--line-strong);border-top:0;border-radius:0 0 4px 4px;box-shadow:var(--shadow-drop)}
/* 화면 빛이 프레임 양옆에 번지는 반사 */
.cab:before{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(90deg,color-mix(in srgb,var(--gc) calc(var(--lit) * 22%),transparent),transparent 18%,transparent 82%,color-mix(in srgb,var(--gc) calc(var(--lit) * 22%),transparent))}
/* 바닥 접촉 그림자 */
.cab:after{content:'';position:absolute;left:-4%;right:-4%;bottom:-9px;height:16px;pointer-events:none;z-index:-1;
  background:radial-gradient(ellipse 50% 50% at 50% 50%,var(--shadow-contact),transparent 75%)}

.screen{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:var(--screen-r,5px);
  background:radial-gradient(ellipse 80% 65% at 50% 72%,color-mix(in srgb,var(--gc) calc(var(--lit) * 26%),transparent),transparent 75%),var(--surface-deep);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gc) calc(18% + var(--lit) * 42%),transparent),inset 0 0 calc(var(--lit) * 30px) color-mix(in srgb,var(--gc) calc(var(--lit) * 22%),transparent),inset 0 10px 24px var(--shadow-contact)}
.screen:after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(118deg,color-mix(in srgb,var(--hl) 9%,transparent) 0 18%,transparent 18.5% 64%,color-mix(in srgb,var(--hl) 4%,transparent) 64.5% 72%,transparent 72.5%)}
.game-art{display:block;width:100%;height:100%;padding:6px 2px 0;color:var(--gc);pointer-events:none;
  filter:brightness(calc(.7 + var(--lit) * .36)) saturate(calc(.7 + var(--lit) * .38))}

/* 정보 판 */
.game-copy{flex:none;height:var(--copy-h);display:flex;flex-direction:column;position:relative;padding:15px 15px 13px;border-radius:3px;
  background:linear-gradient(var(--surface-panel-hi),var(--surface-panel));border-top:1px solid var(--line-strong);box-shadow:0 -6px 0 var(--surface-shadow)}
.game-tag{font-size:13px;line-height:1.35;color:color-mix(in srgb,var(--gc) 78%,var(--ink));letter-spacing:.01em}
.game-name{display:block;margin-top:5px;font-size:clamp(20px,2.1vh,23px);font-weight:700;line-height:1.3;letter-spacing:-.04em;word-break:keep-all}
.game-desc{display:block;margin-top:7px;color:var(--ink-muted);font-size:15px;line-height:1.55;letter-spacing:-.025em;word-break:keep-all;text-wrap:pretty}
.game-meta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;line-height:1;color:var(--ink-muted);padding:5px 8px;border:1px solid var(--line-strong);border-radius:99px}
.status:before{content:'';width:5px;height:5px;border-radius:50%;background:var(--ink-subtle)}
.picked{display:none;align-items:center;gap:4px;font-size:12.5px;font-weight:700;line-height:1;padding:5px 8px;border-radius:3px;background:var(--ink);color:var(--ink-on-accent)}
.picked:before{content:'✓'}
.game[aria-pressed=true] .picked{display:inline-flex}
.game[aria-pressed=true] .status:before{background:var(--gc)}
.game[aria-pressed=true] .game-copy{border-top-color:var(--gc)}

/* 바닥 반사 */
.reflect{position:absolute;left:-12%;right:-12%;top:100%;height:130px;pointer-events:none;z-index:-1;
  background:radial-gradient(ellipse 46% 42% at 50% 0%,color-mix(in srgb,var(--gc) calc(var(--lit) * 42%),transparent),transparent 74%),
  linear-gradient(180deg,color-mix(in srgb,var(--gc) calc(var(--lit) * 10%),transparent),transparent 60%) 50% 0 / 76% 100% no-repeat}
.reflect:after{content:'';position:absolute;left:30%;right:30%;top:2px;height:3px;border-radius:3px;background:var(--gc);opacity:0;transition:opacity .3s}
.game[aria-pressed=true] .reflect:after{opacity:.9;box-shadow:0 0 14px var(--gc)}

/* ── 게임별 기계 구조·재질 ── */
.g-fortune{--gc:var(--game-fortune);--tier:1;--h:1;--crown-h:.13;--frame:7px;--screen-r:46% 46% 5px 5px / 18% 18% 5px 5px;
  --cab-flat:color-mix(in srgb,var(--gc) 12%,var(--surface-cabinet));
  --cab-bg:linear-gradient(100deg,color-mix(in srgb,var(--gc) 16%,var(--surface-cabinet-hi)),color-mix(in srgb,var(--gc) 12%,var(--surface-cabinet)) 14% 86%,color-mix(in srgb,var(--gc) 16%,var(--surface-cabinet-hi)))}
.g-lotto{--gc:var(--game-lotto);--tier:.55;--h:.94;--crown-h:.16;--frame:11px;--screen-r:16px;
  --cab-flat:var(--surface-metal);
  --cab-bg:linear-gradient(90deg,var(--surface-metal-hi),var(--surface-metal) 9%,var(--surface-metal-lo) 30% 70%,var(--surface-metal) 91%,var(--surface-metal-hi))}
.g-pinball{--gc:var(--game-pinball);--tier:.5;--h:.985;--crown-h:.12;--frame:13px;--screen-r:4px;
  --cab-flat:var(--surface-cabinet-hi);
  --cab-bg:linear-gradient(90deg,var(--surface-metal-hi) 0 2px,var(--surface-metal) 2px 11px,var(--surface-cabinet) 11px calc(100% - 11px),var(--surface-metal) calc(100% - 11px) calc(100% - 2px),var(--surface-metal-hi) calc(100% - 2px))}
.g-ladder{--gc:var(--game-ladder);--tier:.42;--h:.965;--crown-h:.1;--frame:5px;--screen-r:2px;
  --cab-flat:var(--surface-cabinet);
  --cab-bg:repeating-linear-gradient(45deg,color-mix(in srgb,var(--ink) 5%,transparent) 0 1px,transparent 1px 7px),repeating-linear-gradient(-45deg,color-mix(in srgb,var(--ink) 5%,transparent) 0 1px,transparent 1px 7px),var(--surface-cabinet)}
.g-wheel{--gc:var(--game-wheel);--tier:.8;--h:.955;--crown-h:.15;--frame:12px;--screen-r:50% 50% 5px 5px / 34% 34% 5px 5px;
  --cab-flat:color-mix(in srgb,var(--gc) 9%,var(--surface-cabinet));
  --bulb:radial-gradient(circle,color-mix(in srgb,var(--gc) calc(25% + var(--crown) * 70%),var(--surface-cabinet)) 0 1.9px,transparent 2.8px);
  --cab-bg:var(--bulb) left 0 top 6px / 12px 17px repeat-y,var(--bulb) right 0 top 6px / 12px 17px repeat-y,color-mix(in srgb,var(--gc) 9%,var(--surface-cabinet))}
.g-horse{--gc:var(--game-horse);--tier:.6;--h:.91;--crown-h:.12;--frame:9px;--screen-r:6px;
  --cab-flat:var(--surface-warm);
  --cab-bg:repeating-linear-gradient(90deg,color-mix(in srgb,var(--surface-warm) 100%,transparent) 0 5px,color-mix(in srgb,var(--surface-warm) 82%,var(--surface-shadow)) 5px 7px,color-mix(in srgb,var(--surface-warm) 92%,var(--hl)) 7px 8px,var(--surface-warm) 8px 13px)}
.g-racing{--gc:var(--game-racing);--tier:.66;--h:.965;--crown-h:.09;--frame:8px;--screen-r:3px;
  --cab-flat:var(--surface-cabinet-hi);
  --cab-bg:repeating-linear-gradient(45deg,var(--surface-cabinet) 0 3px,var(--surface-cabinet-hi) 3px 6px)}

/* 준비 중 안내 */
.notice{position:absolute;top:30px;left:0;width:min(590px,100%);display:flex;align-items:center;gap:22px;padding:16px 16px 16px 22px;
  background:var(--surface-panel-hi);border:1px solid var(--line-strong);border-radius:6px;box-shadow:var(--shadow-drop);
  opacity:0;visibility:hidden;transform:translateY(6px);transition:opacity .25s,transform .25s,visibility 0s .25s,left .3s ease}
.notice.is-open{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .25s,left .3s ease}
.notice:before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--nc,var(--accent))}
.notice-notch{position:absolute;top:-6px;left:var(--notch,40px);width:11px;height:11px;background:var(--surface-panel-hi);border-left:1px solid var(--line-strong);border-top:1px solid var(--line-strong);transform:translateX(-50%) rotate(45deg)}
.notice-text{flex:1;min-width:0}
.notice-title{font-size:17px;font-weight:700;line-height:1.35}
.notice-body{margin-top:3px;font-size:15px;line-height:1.5;color:var(--ink-muted);word-break:keep-all}
.notice-ok{flex:none;border:0;border-radius:4px;padding:10px 18px;font-size:15px;font-weight:700;background:var(--accent);color:var(--ink-on-accent)}
.notice-ok:hover{filter:brightness(1.08)}
.notice-ok:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* ── 일러스트 공통 칠 ── */
.art .f-metal{fill:url(#metal)}
.art .f-deep{fill:var(--surface-deep)}
.art .f-shadow{fill:var(--surface-shadow)}
.art .f-g{fill:currentColor}
.art .s-g{stroke:currentColor}
.art .s-gm{stroke:color-mix(in srgb,currentColor 45%,var(--surface-metal))}
.art .s-metal{stroke:var(--surface-metal-hi)}
.art .s-deep{stroke:var(--surface-deep)}
.art .f-hl{fill:color-mix(in srgb,currentColor 22%,var(--hl))}
.art .s-hl{stroke:color-mix(in srgb,currentColor 22%,var(--hl))}
.art .f-ball-ink{fill:var(--ball-ink)}
.art .f-accent{fill:var(--accent)}
.art .s-accent{stroke:var(--accent)}
.art .f-subtle{fill:var(--ink-subtle)}
.art .s-subtle{stroke:var(--ink-subtle)}
.st-m1{stop-color:var(--surface-metal-hi)}
.st-m2{stop-color:var(--surface-metal-lo)}
.st-m3{stop-color:var(--surface-metal)}
.st-m4{stop-color:var(--surface-shadow)}
.st-g{stop-color:currentColor}
.st-hl{stop-color:var(--hl)}
.st-deep{stop-color:var(--surface-deep)}
.art .w1{fill:currentColor;fill-opacity:.85}
.art .w2{fill:color-mix(in srgb,var(--accent) 55%,var(--surface-deep))}
.art .w3{fill:color-mix(in srgb,var(--accent) 22%,var(--surface-deep))}
.art .w4{fill:color-mix(in srgb,currentColor 58%,var(--surface-warm))}


/* ───────── 캔디 팝 테마 디자인 ───────── */
body{background:radial-gradient(ellipse 70% 55% at 50% 64%,var(--bg-glow),transparent 70%),radial-gradient(ellipse 50% 40% at 12% 8%,color-mix(in srgb,var(--game-fortune) 9%,transparent),transparent 70%),radial-gradient(ellipse 45% 40% at 92% 10%,color-mix(in srgb,var(--game-ladder) 7%,transparent),transparent 70%),var(--bg)}
body:before{background:repeating-linear-gradient(90deg,transparent 0 46px,color-mix(in srgb,var(--accent) 2.6%,transparent) 46px 92px)}
.brand svg{filter:drop-shadow(0 0 10px color-mix(in srgb,var(--accent) 55%,transparent))}
.intro h1{letter-spacing:-.05em}
.arcade-room{background:linear-gradient(180deg,color-mix(in srgb,var(--surface-room) 92%,var(--accent)),transparent 74%);border-radius:28px 28px 0 0}
.arcade-room:before{height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--game-fortune),var(--accent),var(--game-lotto),var(--game-ladder),var(--game-racing),transparent);opacity:.75;box-shadow:0 3px 26px 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.room-labels span:before{height:3px;width:20px;border-radius:3px;background:color-mix(in srgb,var(--accent) 55%,var(--line-strong))}
/* 광택 비닐 바닥 */
.floor{border-top:0;background:
  linear-gradient(180deg,color-mix(in srgb,var(--accent) 7%,var(--surface-floor)),transparent 88%)}
.floor:before{height:2px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--hl) 30%,transparent) 30%,color-mix(in srgb,var(--hl) 30%,transparent) 70%,transparent)}
.floor:after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(circle,color-mix(in srgb,var(--ink) 6%,transparent) 0 2px,transparent 2.5px) 0 14px / 34px 34px,
  linear-gradient(180deg,transparent,var(--bg) 92%);-webkit-mask:linear-gradient(180deg,#000,transparent 80%);mask:linear-gradient(180deg,#000,transparent 80%)}
/* 둥근 광택 플라스틱 케이스 */
.game:focus-visible{border-radius:var(--radius-cabinet);outline-width:3px}
.game:hover,.game:focus-visible{transform:translateY(-6px) scale(1.012)}
.game{transition:--lit .35s ease,--crown .35s ease,transform .3s cubic-bezier(.34,1.56,.64,1)}
.cab{border-radius:0 0 var(--radius-cabinet) var(--radius-cabinet);border-color:color-mix(in srgb,var(--gc) 30%,var(--line-strong));
  box-shadow:var(--shadow-drop),inset 0 1px 0 var(--gloss),inset 3px 0 0 var(--gloss-soft),inset -3px 0 0 color-mix(in srgb,var(--surface-shadow) 35%,transparent)}
.cab:after{bottom:-11px;height:20px;left:2%;right:2%}
.cab>.gloss{position:absolute;left:9%;top:8px;width:7px;bottom:calc(var(--copy-h) + 22px);border-radius:7px;pointer-events:none;z-index:2;
  background:linear-gradient(180deg,var(--gloss),transparent 80%)}
.crown .cr-body{stroke:color-mix(in srgb,var(--gc) 35%,var(--line-strong));stroke-linejoin:round}
.crown .cr-edge{stroke:var(--hl);stroke-opacity:.28;stroke-linejoin:round}

<script>
(() => {
  const games = Array.from(document.querySelectorAll('.game'));
  const notice = document.getElementById('notice');
  const noticeTitle = document.getElementById('notice-title');
  const okBtn = document.getElementById('notice-ok');
  const floor = notice.parentElement;
  let selected = null;

  const setRoving = (game) => games.forEach(g => g.tabIndex = g === game ? 0 : -1);

  const placeNotice = () => {
    if (!selected) return;
    const f = floor.getBoundingClientRect();
    const g = selected.getBoundingClientRect();
    const w = notice.offsetWidth;
    const center = g.left + g.width / 2 - f.left;
    const pad = 24;
    const left = Math.max(pad, Math.min(center - w / 2, f.width - w - pad));
    notice.style.left = left + 'px';
    notice.style.setProperty('--notch', (center - left) + 'px');
  };

  const openNotice = (game) => {
    notice.style.setProperty('--nc', getComputedStyle(game).getPropertyValue('--gc'));
    notice.classList.add('is-open');
    noticeTitle.textContent = game.dataset.name + ' 준비 중';
    placeNotice();
  };
  const closeNotice = () => {
    const hadFocus = notice.contains(document.activeElement);
    notice.classList.remove('is-open');
    if (hadFocus && selected) selected.focus();
  };

  const select = (game) => {
    selected = game;
    games.forEach(g => g.setAttribute('aria-pressed', String(g === game)));
    setRoving(game);
    openNotice(game);
  };

  games.forEach((game, i) => {
    game.addEventListener('click', () => select(game));
    game.addEventListener('focus', () => setRoving(game));
    game.addEventListener('keydown', (e) => {
      let next = null;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = games[(i + 1) % games.length];
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = games[(i - 1 + games.length) % games.length];
      else if (e.key === 'Home') next = games[0];
      else if (e.key === 'End') next = games[games.length - 1];
      if (next) { e.preventDefault(); setRoving(next); next.focus(); }
    });
  });

  okBtn.addEventListener('click', closeNotice);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && notice.classList.contains('is-open')) closeNotice(); });
  window.addEventListener('resize', placeNotice);
})();
</script>
