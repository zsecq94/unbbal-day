const games=Array.from(document.querySelectorAll('[data-game]'));
const status=document.getElementById('selection-status');
games.forEach((game)=>{
 game.addEventListener('click',()=>{
  games.forEach(item=>item.setAttribute('aria-pressed',String(item===game)));
  status.textContent=game.dataset.name+' · 준비 중';
  status.classList.add('has-selection');
 });
 game.addEventListener('keydown',event=>{
  const directions={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
  if(event.key==='Home'||event.key==='End'){
   event.preventDefault();games[event.key==='Home'?0:games.length-1].focus();return;
  }
  if(!directions[event.key])return;
  event.preventDefault();
  const [dx,dy]=directions[event.key];const box=game.getBoundingClientRect();
  const x=box.x+box.width/2,y=box.y+box.height/2;
  let best=null,score=Infinity;
  games.filter(other=>other!==game).forEach(other=>{
   const r=other.getBoundingClientRect(),vx=r.x+r.width/2-x,vy=r.y+r.height/2-y;
   const along=vx*dx+vy*dy,across=Math.abs(vx*dy-vy*dx);
   if(along>8){const next=along+across*2.5;if(next<score){best=other;score=next}}
  });
  if(best)best.focus();
 });
});
