<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="data:," />
    <title>운빨데이 · 디자인 시안</title>
    <link rel="stylesheet" href="./shared/theme.css" />
    <style>
      .hero {
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 28px 24px 30px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--tile);
      }
      @media (min-width: 640px) {
        .hero {
          padding: 34px 40px 36px;
        }
      }
      .hero h1 {
        font-size: clamp(28px, 3.4vw, 46px);
        line-height: 1.1;
        font-weight: 800;
        letter-spacing: -0.05em;
      }
      .hero p {
        max-width: 60ch;
        font-size: 15.5px;
        line-height: 1.55;
        color: var(--ink-2);
      }
      .list {
        display: grid;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      @media (min-width: 900px) {
        .list {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      .tile {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 220px;
        padding: 22px 24px 24px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--tile);
        color: var(--ink);
        text-decoration: none;
        transition:
          border-color 200ms,
          background-color 200ms,
          transform 150ms var(--ease);
      }
      .tile:hover {
        border-color: rgb(79 134 255 / 0.7);
        background: var(--tile-lit);
      }
      .tile:active {
        transform: scale(0.985);
      }
      .tile .row {
        display: flex;
        justify-content: space-between;
        font: 500 12px var(--font-mono);
        letter-spacing: 0.12em;
        color: var(--ink-3);
      }
      .tile h2 {
        margin-top: auto;
        font-size: 28px;
        line-height: 1.12;
        font-weight: 750;
        letter-spacing: -0.045em;
      }
      .tile p {
        font-size: 14.5px;
        line-height: 1.5;
        color: var(--ink-2);
      }
      .tile .demo {
        align-self: flex-start;
        font: 500 11px var(--font-mono);
        letter-spacing: 0.1em;
        color: var(--ink-3);
      }
      .note {
        padding: 0 4px;
        font-size: 13px;
        line-height: 1.6;
        color: var(--ink-3);
      }
      .note code {
        font: 500 12px var(--font-mono);
        color: var(--ink-2);
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <section class="hero">
        <h1>디자인 시안</h1>
        <p>
          구현의 기준이 된 정적 시안입니다. 앱 코드와는 무관하며, 화면을
          손볼 때 먼저 여기서 모양과 동작을 맞춰 본 뒤 옮깁니다.
        </p>
      </section>
      <ul class="list">
        <li>
          <a class="tile" href="./fortune-sentence.html">
            <span class="row"><span>01</span><span>확정 · 2026-10</span></span>
            <h2>오늘의 운세 · 문장</h2>
            <p>빈칸 문장을 채우면 미리보기가 바뀌고, 결과는 각주 달린 한 문단과 여섯 분야 트랙을 짚어 읽습니다.</p>
            <span class="demo">?demo → 결과 화면 바로 열기</span>
          </a>
        </li>
      </ul>
      <p class="note">
        검증: 저장소 루트에서 <code>sh mockups/tools/run.sh</code>. 폰트를
        node_modules에서 읽으므로 http로 띄워야 합니다.
      </p>
    </main>
  </body>
</html>
