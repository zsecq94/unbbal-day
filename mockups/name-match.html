<!doctype html>
<!-- 이름 궁합 확정 시안: 빈칸 두 개짜리 문장으로 이름을 받고, 계산(번갈아 쓰기 → 획수 → 피라미드)을 한 줄씩 보여 준 뒤, 두 방향 점수와 근거 피라미드를 보여 준다. 한글은 획수 궁합, 로마자는 LOVES 놀이. -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="data:," />
    <title>운빨데이 · 이름 궁합</title>
    <link rel="stylesheet" href="./shared/theme.css" />
    <style>
      /* ─── 상태 뷰: 입력 → 계산 → 결과 ───────────────────────── */
      html[data-state='analyzing'] .view-input,
      html[data-state='analyzing'] .view-result,
      html[data-state='input'] .view-analyzing,
      html[data-state='result'] .view-analyzing {
        display: none !important;
      }
      html[data-state='analyzing'] .frame {
        height: 100dvh;
        min-height: 0;
      }

      /* ─── 위 띠: 계산 방식과 획수표 ───────────────────────────── */
      .band {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px 18px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
      }
      @media (min-width: 640px) {
        .band {
          padding: 14px 28px;
        }
      }
      .method {
        display: flex;
        align-items: baseline;
        gap: 12px;
        min-width: 0;
      }
      .method .label {
        flex: none;
        white-space: nowrap;
      }
      .method b {
        font-size: 15px;
        font-weight: 750;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      .method span:last-child {
        overflow: hidden;
        font-size: 13px;
        color: var(--ink-3);
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .band .link {
        margin-left: auto;
        flex: none;
      }
      .rules {
        position: absolute;
        top: calc(100% - 1px);
        right: 12px;
        left: 12px;
        z-index: 10;
        display: grid;
        gap: 14px;
        max-width: 560px;
        margin-left: auto;
        padding: 18px 20px 20px;
        border: 1px solid var(--line-strong);
        background: var(--canvas);
        animation: pop 160ms var(--ease) both;
      }
      @media (min-width: 640px) {
        .rules {
          right: 28px;
        }
      }
      @keyframes pop {
        from {
          opacity: 0;
          translate: 0 -4px;
        }
      }
      .rules[hidden] {
        display: none;
      }
      .jamo {
        display: grid;
        gap: 10px;
      }
      .jamo div {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 4px;
      }
      .jamo .label {
        grid-column: 1 / -1;
      }
      .jamo span {
        display: grid;
        justify-items: center;
        gap: 2px;
        padding: 6px 0 5px;
        border: 1px solid var(--line);
        font-size: 16px;
        font-weight: 700;
      }
      .jamo small {
        font: 500 11px var(--font-mono);
        color: var(--ink-3);
      }
      .rules p {
        font-size: 13.5px;
        line-height: 1.6;
        color: var(--ink-2);
        word-break: keep-all;
      }
      .rules p b {
        color: var(--ink);
      }

      /* ─── 입력: 빈칸 두 개짜리 문장 ───────────────────────────── */
      .view-input {
        display: flex;
        flex-direction: column;
      }
      .sheet {
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        gap: 30px;
        padding: 40px 20px 28px;
      }
      @media (min-width: 640px) {
        .sheet {
          padding: 56px 28px 36px;
        }
      }
      @media (min-width: 1024px) {
        .sheet {
          padding: 48px clamp(28px, 6vw, 104px) 40px;
        }
      }
      .sentence {
        max-width: 22em;
        font-size: clamp(26px, 4.6vw + 6px, 60px);
        line-height: 1.7;
        font-weight: 700;
        letter-spacing: -0.035em;
        color: var(--ink-2);
        word-break: keep-all;
      }
      .sentence .loves {
        font-family: var(--font-mono);
        font-size: 0.72em;
        font-weight: 500;
        letter-spacing: 0.08em;
        color: var(--brand-hi);
      }
      .blank {
        display: inline-block;
        margin: 0 0.02em;
        line-height: 1.25;
      }
      .blank input {
        width: var(--w, 4.4em);
        min-width: 1.6em;
        padding: 0 0.05em;
        border-bottom: 2px solid var(--ink-3);
        font-weight: 750;
        line-height: 1.25;
        text-align: center;
        color: var(--ink);
        transition: border-color 200ms;
      }
      .blank input::placeholder {
        color: var(--ink-3);
      }
      .blank input:focus {
        border-bottom-color: var(--ink);
        outline: none;
      }
      .blank.ok input {
        border-bottom-color: var(--line-strong);
      }
      .blank.bad input {
        border-bottom-color: #d4724f;
      }
      .measure {
        position: absolute;
        visibility: hidden;
        font-weight: 750;
        white-space: pre;
        pointer-events: none;
      }

      /* 미리보기: 입력하는 동안 번갈아 쓴 글자와 획수(또는 LOVES 개수)가 바로 보인다 */
      .preview {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 14px;
        min-height: 58px;
      }
      .preview .label {
        flex: none;
      }
      .preview p {
        font-size: 15px;
        line-height: 1.55;
        color: var(--ink-3);
      }
      .tape {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .tape span {
        display: grid;
        justify-items: center;
        min-width: 38px;
        padding: 5px 6px 4px;
        border: 1px solid var(--line);
        font-size: 17px;
        font-weight: 750;
        animation: pop 180ms var(--ease) both;
      }
      .tape span.b {
        color: var(--ink-2);
      }
      .tape small {
        font: 500 12px var(--font-mono);
        color: var(--ink-3);
      }
      .in-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 20px;
        border-top: 1px solid var(--line);
      }
      @media (min-width: 640px) {
        .in-foot {
          padding: 18px 28px;
        }
      }
      .hint {
        font-size: 14px;
        line-height: 1.5;
        color: var(--ink-3);
        word-break: keep-all;
      }
      .hint.bad {
        color: #e0916f;
      }

      /* ─── 피라미드 ─────────────────────────────────────────── */
      .pyr {
        --cell: 32px;
        --gap: max(2px, calc(var(--cell) * 0.12));
        display: grid;
        justify-items: center;
        gap: var(--gap);
      }
      .pyr .row {
        display: flex;
        gap: var(--gap);
      }
      .pyr .cell {
        display: grid;
        place-items: center;
        width: var(--cell);
        height: var(--cell);
        border: 1px solid var(--line);
        font: 500 calc(var(--cell) * 0.46) / 1 var(--font-mono);
        color: var(--ink-2);
      }
      .pyr .letters .cell {
        border-color: transparent;
        font: 750 calc(var(--cell) * 0.56) / 1 var(--font-sans);
        color: var(--ink);
      }
      .pyr .letters .cell.b,
      .pyr .first .cell.b {
        color: var(--ink-3);
      }
      .pyr .first .cell {
        border-color: var(--line-strong);
        color: var(--ink);
      }
      .pyr .last .cell {
        border-color: var(--brand-hi);
        background: rgb(79 134 255 / 0.12);
        color: var(--ink);
        font-weight: 700;
      }
      /* LOVES: 10 이상이라 두 자리로 쪼갠 칸은 아래에 묶음 선이 붙는다 */
      .pyr .pair {
        position: relative;
        display: flex;
        gap: 1px;
      }
      .pyr .pair::after {
        content: '';
        position: absolute;
        right: 2px;
        bottom: calc(var(--gap) * -0.5 - 1px);
        left: 2px;
        height: 1px;
        background: var(--brand-hi);
        opacity: 0.6;
      }
      .pyr .gapline {
        font: 500 11px var(--font-mono);
        letter-spacing: 0.1em;
        color: var(--ink-3);
      }
      .pyr .loop .cell {
        border-style: dashed;
        border-color: var(--brand-hi);
        color: var(--brand-hi);
      }
      .pyr .row.hide {
        visibility: hidden;
      }
      .pyr .row.show {
        animation: row-in 260ms var(--ease) both;
      }
      @keyframes row-in {
        from {
          opacity: 0;
          translate: 0 -6px;
        }
      }
      .pyr-cap {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 10px;
        max-width: 100%;
        margin-bottom: 10px;
        font-size: 14px;
        font-weight: 700;
        color: var(--ink-2);
        white-space: nowrap;
      }
      .pyr-cap > span:last-child {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pyr-cap .label {
        flex: none;
      }
      .pyr-cap .label {
        color: var(--ink-3);
      }

      /* ─── 계산 화면 ────────────────────────────────────────── */
      .view-analyzing {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
      }
      .steps {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 22px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
        list-style: none;
        margin: 0;
      }
      @media (min-width: 640px) {
        .steps {
          padding: 16px 28px;
        }
      }
      .steps li {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13.5px;
        font-weight: 700;
        color: var(--ink-3);
        transition: color 200ms;
      }
      .steps li i {
        font: 500 11px var(--font-mono);
        font-style: normal;
      }
      .steps li.now {
        color: var(--ink);
      }
      .steps li.now i {
        color: var(--brand-hi);
      }
      .steps li.done {
        color: var(--ink-2);
      }
      .stage-pyrs {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(0, 1fr);
        align-items: center;
        min-height: 0;
        padding: 20px;
      }
      .fit {
        display: grid;
        place-items: center;
        min-width: 0;
        min-height: 0;
        height: 100%;
      }
      .fit > div {
        display: grid;
        justify-items: center;
        min-width: 0;
        max-width: 100%;
      }
      .an-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 20px;
        border-top: 1px solid var(--line);
      }
      @media (min-width: 640px) {
        .an-foot {
          padding: 16px 28px;
        }
      }

      /* ─── 결과 ─────────────────────────────────────────────── */
      .view-result {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        gap: 14px;
        padding: 16px 20px 16px;
      }
      @media (min-width: 640px) {
        .view-result {
          gap: 18px;
          padding: 24px 28px 22px;
        }
      }
      @media (min-width: 1280px) {
        .view-result {
          padding: 30px clamp(28px, 4vw, 72px) 26px;
        }
      }
      .scores {
        display: flex;
        flex-wrap: wrap;
        align-items: stretch;
        gap: 10px;
      }
      .card {
        display: grid;
        gap: 4px;
        min-width: 0;
        padding: 10px 14px 10px;
        border: 1px solid var(--line);
        text-align: left;
        transition:
          border-color 200ms,
          transform 150ms var(--ease);
      }
      .card:active {
        transform: scale(0.98);
      }
      .card[aria-pressed='true'] {
        border-color: var(--ink-3);
      }
      .card .who {
        overflow: hidden;
        font-size: 13px;
        font-weight: 700;
        color: var(--ink-3);
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .card .who .arrow {
        margin: 0 5px;
        font-family: var(--font-mono);
      }
      .card b {
        font: 500 clamp(30px, 3.4vw, 46px) / 1 var(--font-mono);
        letter-spacing: -0.04em;
      }
      .card b small {
        margin-left: 3px;
        font-size: 0.4em;
        color: var(--ink-3);
      }
      @media (max-width: 639px) {
        .card {
          padding: 8px 12px;
        }
        .card b {
          font-size: 28px;
        }
        .answer {
          font-size: clamp(18px, 4.6vw + 2px, 24px);
        }
        /* 같은 설명이 입력 화면의 계산 규칙에 있다 */
        .res-foot p {
          display: none;
        }
      }
      @media (max-height: 700px) {
        .res-foot p {
          display: none;
        }
      }
      .answer {
        max-width: 26em;
        font-size: clamp(22px, 2.4vw + 6px, 46px);
        line-height: 1.38;
        font-weight: 700;
        letter-spacing: -0.035em;
        color: var(--ink-2);
        word-break: keep-all;
      }
      .answer em {
        font-style: normal;
        color: var(--ink);
        box-shadow: inset 0 -0.08em var(--ink-3);
      }
      .proof {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(0, 1fr);
        min-height: 0;
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }
      .proof .fit {
        grid-template-rows: auto minmax(0, 1fr);
      }
      /* 좁은 화면에서는 고른 방향 하나만 보인다(점수 카드로 고른다) */
      @media (max-width: 639px) {
        .proof[data-dir='0'] > .fit:nth-child(2),
        .proof[data-dir='1'] > .fit:nth-child(1) {
          display: none;
        }
      }
      .res-foot {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px 16px;
      }
      .res-foot p {
        font-size: 13px;
        line-height: 1.5;
        color: var(--ink-3);
        word-break: keep-all;
      }
      /* 넓은 화면: 왼쪽에 점수와 문장, 오른쪽에 근거 피라미드 */
      @media (min-width: 1024px) {
        .view-result {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          grid-template-rows: auto minmax(0, 1fr) auto;
          grid-template-areas:
            'scores proof'
            'answer proof'
            'foot foot';
          column-gap: clamp(32px, 4vw, 64px);
        }
        .scores {
          grid-area: scores;
        }
        .answer {
          grid-area: answer;
          align-self: start;
        }
        .proof {
          grid-area: proof;
          padding-top: 0;
          padding-left: clamp(24px, 3vw, 48px);
          border-top: 0;
          border-left: 1px solid var(--line);
        }
        .res-foot {
          grid-area: foot;
        }
      }
      .res-foot .acts {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-left: auto;
      }
      .res-foot .btn {
        flex: none;
      }
      .endless b {
        color: var(--brand-hi);
      }

      @media (prefers-reduced-motion: reduce) {
        .pyr .row.show,
        .tape span,
        .rules {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <section class="stage" aria-labelledby="game-title" data-index="03" data-title="이름 궁합" data-kind="혼자">
        <div class="stage-body">
          <!-- ─── 입력 ─── -->
          <form class="view view-input in" id="viewInput" novalidate autocomplete="off">
            <div class="band">
              <p class="method"><span class="label" data-t="methodLabel"></span><b id="methodName"></b><span id="methodHow"></span></p>
              <button class="link" type="button" id="rulesBtn" aria-expanded="false" aria-controls="rules"></button>
              <div class="rules" id="rules" hidden></div>
            </div>
            <div class="sheet">
              <p class="sentence" id="sentence"></p>
              <div class="preview" aria-live="polite">
                <span class="label">Preview</span>
                <div id="preview"></div>
              </div>
            </div>
            <div class="in-foot">
              <p class="hint" id="hint"></p>
              <button class="btn btn-primary" id="go" type="submit" disabled><span data-t="go"></span> <span class="key" aria-hidden="true">↵</span></button>
            </div>
          </form>

          <!-- ─── 계산 ─── -->
          <div class="view view-analyzing" id="viewAnalyzing">
            <ol class="steps" id="steps"></ol>
            <div class="stage-pyrs" id="anPyrs"></div>
            <div class="an-foot">
              <p class="hint" id="anHint"></p>
              <button class="btn" type="button" id="skip"><span data-t="skip"></span> <span class="key" aria-hidden="true">↵</span></button>
            </div>
          </div>

          <!-- ─── 결과 ─── -->
          <div class="view view-result" id="viewResult">
            <div class="scores" id="scores"></div>
            <p class="answer" id="answer"></p>
            <div class="proof" id="proof" data-dir="0"></div>
            <div class="res-foot">
              <p id="resNote"></p>
              <span class="acts">
                <button class="link" type="button" id="edit"><span class="arrow" aria-hidden="true">←</span><span data-t="edit"></span></button>
                <button class="btn" type="button" id="again"><span data-t="again"></span></button>
              </span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script>
      /* 스테이지 헤더 심볼: components/game-symbol.tsx의 match */
      window.STAGE_SYMBOL =
        '<circle cx="17" cy="24" r="11"/><circle cx="31" cy="24" r="11"/><path class="f" d="M24 15.51 A11 11 0 0 1 24 32.49 A11 11 0 0 1 24 15.51 Z"/>'
    </script>
    <script src="./shared/chrome.js"></script>
    <script>
      ;(() => {
        const $ = (s) => document.querySelector(s)
        const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`)
        const params = new URLSearchParams(location.search)
        const lang = params.get('lang') === 'en' ? 'en' : 'ko'
        const reduced = Mock.reduced

        /* ── 계산: lib/name-match와 같은 규칙(시안용으로 옮김) ─────────── */
        const BASE = { ㄱ: 2, ㄴ: 2, ㄷ: 3, ㄹ: 5, ㅁ: 4, ㅂ: 4, ㅅ: 2, ㅇ: 1, ㅈ: 3, ㅊ: 4, ㅋ: 3, ㅌ: 4, ㅍ: 4, ㅎ: 3, ㅏ: 2, ㅑ: 3, ㅓ: 2, ㅕ: 3, ㅗ: 2, ㅛ: 3, ㅜ: 2, ㅠ: 3, ㅡ: 1, ㅣ: 1 }
        const CHO = 'ㄱ ㄱㄱ ㄴ ㄷ ㄷㄷ ㄹ ㅁ ㅂ ㅂㅂ ㅅ ㅅㅅ ㅇ ㅈ ㅈㅈ ㅊ ㅋ ㅌ ㅍ ㅎ'.split(' ')
        const JUNG = 'ㅏ ㅏㅣ ㅑ ㅑㅣ ㅓ ㅓㅣ ㅕ ㅕㅣ ㅗ ㅗㅏ ㅗㅏㅣ ㅗㅣ ㅛ ㅜ ㅜㅓ ㅜㅓㅣ ㅜㅣ ㅠ ㅡ ㅡㅣ ㅣ'.split(' ')
        const JONG = ['', ...'ㄱ ㄱㄱ ㄱㅅ ㄴ ㄴㅈ ㄴㅎ ㄷ ㄹ ㄹㄱ ㄹㅁ ㄹㅂ ㄹㅅ ㄹㅌ ㄹㅍ ㄹㅎ ㅁ ㅂ ㅂㅅ ㅅ ㅅㅅ ㅇ ㅈ ㅊ ㅋ ㅌ ㅍ ㅎ'.split(' ')]
        const sum = (j) => [...j].reduce((n, c) => n + BASE[c], 0)
        const strokesOf = (ch) => {
          const i = ch.codePointAt(0) - 0xac00
          if (ch.length !== 1 || i < 0 || i > 11171) return null
          return sum(CHO[Math.floor(i / 588)]) + sum(JUNG[Math.floor((i % 588) / 28)]) + sum(JONG[i % 28])
        }
        const hangul = (s) => {
          const c = [...s.replace(/\s+/g, '')]
          return c.length && c.every((x) => strokesOf(x) !== null) ? c : null
        }
        const latin = (s) => {
          const l = s.normalize('NFD').replace(/\p{M}/gu, '').toUpperCase().replace(/[\s'’.-]/g, '')
          return /^[A-Z]+$/.test(l) ? l : null
        }
        /* 두 이름을 한 글자씩 번갈아 놓고, 남는 글자는 뒤에 붙인다 */
        const interleave = (a, b) => {
          const out = []
          for (let i = 0; i < Math.max(a.length, b.length); i++) {
            if (i < a.length) out.push({ ch: a[i], side: 0 })
            if (i < b.length) out.push({ ch: b[i], side: 1 })
          }
          return out
        }
        /* 줄은 칸 묶음의 배열: 획수는 [[n],[n]…], LOVES는 쪼갠 칸이 [[1,2]]로 묶인다 */
        function reduceStrokes(first) {
          const rows = [first.length === 2 ? first.map((n) => n % 10) : first]
          for (;;) {
            const row = rows.at(-1)
            if (row.length === 3 && row.join('') === '100') return { rows, score: 100 }
            if (row.length <= 2) return { rows, score: row[0] === 0 && row[1] === 0 ? 100 : row[0] * 10 + row[1] }
            rows.push(row.slice(1).map((n, i) => (row[i] + n) % 10))
          }
        }
        function strokeReading(a, b) {
          const letters = interleave(a, b)
          const r = reduceStrokes(letters.map((l) => strokesOf(l.ch)))
          return { letters, rows: r.rows.map((row) => row.map((n) => [n])), score: r.score }
        }
        function lovesReading(both) {
          const counts = [...'LOVES'].map((c) => both.split(c).length - 1)
          const rows = [counts.map((n) => [n])]
          const seen = new Map([[counts.join(','), 0]])
          for (;;) {
            const flat = rows.at(-1).flat()
            if (flat.length <= 2) return { counts, rows, score: flat[0] * 10 + flat[1], endless: null }
            const groups = flat.slice(1).map((n, i) => [...String(flat[i] + n)].map(Number))
            const key = groups.flat().join(',')
            if (seen.has(key)) return { counts, rows, score: null, endless: 'cycle', loopTo: seen.get(key) }
            if (groups.flat().length > 40) return { counts, rows, score: null, endless: 'grow' }
            seen.set(key, rows.length)
            rows.push(groups)
          }
        }
        /** 획수는 두 방향, LOVES는 하나 */
        function match(a, b) {
          if (!a.trim() || !b.trim()) return { error: 'empty' }
          const [ha, hb] = [hangul(a), hangul(b)]
          if (ha && hb) {
            if (ha.length > 5 || hb.length > 5) return { error: 'long' }
            return { kind: 'strokes', names: [ha.join(''), hb.join('')], readings: [strokeReading(ha, hb), strokeReading(hb, ha)] }
          }
          const [la, lb] = [latin(a), latin(b)]
          if (la && lb) {
            if (la.length > 40 || lb.length > 40) return { error: 'long' }
            return { kind: 'loves', names: [a.trim(), b.trim()], reading: lovesReading(la + lb) }
          }
          return { error: (ha || la) && (hb || lb) ? 'mixed' : 'unsupported' }
        }

        /* ── 문구 ─────────────────────────────────────────────── */
        const final = (w) => {
          const i = w.charCodeAt(w.length - 1) - 0xac00
          return i >= 0 && i <= 11171 ? i % 28 !== 0 : null
        }
        const josa = (w, a, b) => {
          const f = final(w)
          return f === null ? `${a}(${b})` : f ? a : b
        }
        const T = {
          ko: {

            proofCap: { strokes: '획수 피라미드', loves: 'LOVES 피라미드' },

            rules: {

        }[lang]
        const bandOf = (s) => T.band.find(([min]) => s >= min)[1]

        /* 언어 버튼: 시안에서는 주소의 ?lang만 바꾼다 */
        document.documentElement.lang = lang
        if (lang === 'en') {
          $('.topbar-back .label').textContent = 'Home'

        }

          b.toggleAttribute('aria-current', b.lang === lang)

          b.addEventListener('click', () => {

            u.searchParams.set('lang', b.lang)
            location.href = u
          })
        })
        document.querySelectorAll('[data-t]').forEach((el) => (el.textContent = T[el.dataset.t]))

        /* ── 입력 ─────────────────────────────────────────────── */
        const sentence = $('#sentence')
        const vals = { a: '', b: '' }
        /* 한글을 조합하는 동안(ㄱ → 기 → 김)에는 덜 된 글자로 오류를 띄우지 않는다 */
        let composing = false
        const blank = (id, ph) => `<span class="blank" data-key="${id}"><input id="f-${id}" placeholder="${ph}" aria-label="${ph}" maxlength="40" enterkeyhint="${id === 'a' ? 'next' : 'go'}" spellcheck="false" /></span>`
        /* 문장은 한 번만 그린다. 입력칸 요소를 새로 만들면 조합 중인 글자가 끊긴다 */
        sentence.innerHTML = T.sentence(blank('a', T.a), blank('b', T.b)) + '<span class="measure" id="measure" aria-hidden="true"></span>'
        for (const k of ['a', 'b']) {
          const input = $(`#f-${k}`)
          input.addEventListener('compositionstart', () => (composing = true))
          input.addEventListener('compositionend', () => {
            composing = false
            vals[k] = input.value

          })
          input.addEventListener('input', () => {

          })
          /* 조합을 확정하는 Enter는 건드리지 않는다 */
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && k === 'a' && !e.isComposing) {

            }
          })
        }
        function setNames(a, b) {
          vals.a = $('#f-a').value = a
          vals.b = $('#f-b').value = b

        }
        function sizeInputs() {
          const m = $('#measure')
          const size = parseFloat(getComputedStyle(sentence).fontSize)
          for (const k of ['a', 'b']) {
            const input = $(`#f-${k}`)
            m.textContent = input.value || input.placeholder
            input.style.setProperty('--w', `${m.getBoundingClientRect().width / size + 0.16}em`)
          }
        }
        let current = null
        function update() {
          if (lang === 'ko') $('#josa').textContent = vals.a.trim() ? josa(vals.a.trim(), '과', '와') : '와(과)'
          sizeInputs()
          current = match(vals.a, vals.b)
          const kind = current.kind || 'none'
          $('#methodName').textContent = T.method[kind][0]
          $('#methodHow').textContent = T.method[kind][1]
          $('#rules').innerHTML = (kind === 'loves' ? T.rules.loves : T.rules.strokes + jamoTable()) + T.rules.common
          for (const k of ['a', 'b']) {
            const v = vals[k].trim()
            const ok = v && (hangul(v) || latin(v))
            const el = document.querySelector(`.blank[data-key="${k}"]`)
            el.classList.toggle('ok', !!ok && !current.error)
            el.classList.toggle('bad', !composing && !!v && (!ok || current.error === 'mixed' || current.error === 'long'))
          }
          const hint = $('#hint')
          const err = !composing && current.error && current.error !== 'empty' ? current.error : null
          hint.textContent = err ? T.hint[err] : current.kind === 'strokes' ? T.hint.ready : current.kind === 'loves' ? T.hint.readyLoves : T.hint.idle
          hint.classList.toggle('bad', !!err)
          $('#go').disabled = !current.kind

        }
        function jamoTable() {
          const cells = (list) => list.map(([j, n]) => `<span>${j}<small>${n}</small></span>`).join('')
          const all = Object.entries(BASE)
          return `<div class="jamo" aria-label="자모 획수표"><div><p class="label">${T.consonants}</p>${cells(all.slice(0, 14))}</div><div><p class="label">${T.vowels}</p>${cells(all.slice(14))}</div></div>`
        }
        function drawPreview() {
          const box = $('#preview')
          if (current.kind === 'strokes') {

            box.innerHTML = `<div class="tape">${r.letters.map((l, i) => `<span class="${l.side ? 'b' : ''}">${l.ch}<small>${r.rows[0][i][0]}</small></span>`).join('')}</div>`
          } else if (current.kind === 'loves') {
            box.innerHTML = `<div class="tape">${[...'LOVES'].map((c, i) => `<span>${c}<small>${current.reading.counts[i]}</small></span>`).join('')}</div>`
          } else box.innerHTML = `<p>${T.previewIdle}</p>`
        }
        $('#rulesBtn').textContent = T.rulesBtn
        $('#rulesBtn').addEventListener('click', () => {
          const r = $('#rules')
          r.hidden = !r.hidden
          $('#rulesBtn').setAttribute('aria-expanded', String(!r.hidden))
        })
        document.addEventListener('click', (e) => {
          if (!e.target.closest('.band')) {

            $('#rulesBtn').setAttribute('aria-expanded', 'false')
          }
        })
        $('#viewInput').addEventListener('submit', (e) => {
          e.preventDefault()
          if (current?.kind) analyze()
        })

        /* ── 피라미드 ─────────────────────────────────────────── */
        /* 줄이 많으면(긴 LOVES) 앞과 끝만 그린다. 좁거나 낮은 화면은 더 줄인다 */
        const maxRows = () => (innerHeight < 700 ? 9 : innerWidth < 640 || innerHeight < 760 ? 12 : 20)
        /* LOVES 피라미드 맨 위의 글자 줄 */
        const LOVES_HEAD = [...'LOVES'].map((ch) => ({ ch, side: 0 }))
        function pyramid(reading, letters) {
          const rows = reading.rows
          const max = maxRows()
          let show = rows.map((r, i) => i)
          if (rows.length > max) {
            const head = Math.ceil((max - 1) / 2)
            show = [...show.slice(0, head), -1, ...show.slice(-(max - 1 - head))]
          }
          const hidden = rows.length - show.filter((i) => i !== -1).length
          const cell = (n, cls = '') => `<span class="cell ${cls}">${n}</span>`
          const dim = (l) => (l?.side ? 'b' : '')
          const html = []
          if (letters) html.push(`<div class="row letters">${letters.map((l) => cell(esc(l.ch), dim(l))).join('')}</div>`)
          for (const i of show) {
            if (i === -1) {
              html.push(`<div class="row gapline">${T.skipped(hidden)}</div>`)
              continue
            }
            const last = i === rows.length - 1 && reading.score != null
            const cls = i === 0 ? 'first' : last ? 'last' : ''
            html.push(
              `<div class="row ${cls}">${rows[i]
                .map((g, gi) => (g.length === 1 ? cell(g[0], i === 0 ? dim(letters?.[gi]) : '') : `<span class="pair">${g.map((n) => cell(n)).join('')}</span>`))
                .join('')}</div>`
            )
          }
          if (reading.endless === 'cycle') {
            html.push(`<div class="row loop">${rows[reading.loopTo].flat().map((n) => cell(n)).join('')}</div>`)
            html.push(`<div class="row gapline">${T.loopNote(reading.loopTo + 1)}</div>`)
          }
          if (reading.endless === 'grow') html.push(`<div class="row gapline">${T.growNote}</div>`)
          return `<div class="pyr">${html.join('')}</div>`
        }
        /* 칸 크기를 상자에 맞춘다: 가장 긴 줄의 폭과 줄 수로 정한다 */
        function fit(box) {
          const pyr = box.querySelector('.pyr')
          if (!pyr) return
          const rows = [...pyr.querySelectorAll('.row')]
          const widest = Math.max(...rows.map((r) => r.querySelectorAll('.cell').length))
          const cap = box.querySelector('.pyr-cap')
          const h = box.clientHeight - (cap ? cap.offsetHeight + 10 : 0)
          const w = box.clientWidth
          const byW = w / (widest * 1.14)
          const byH = h / (rows.length * 1.14)
          pyr.style.setProperty('--cell', `${Math.max(12, Math.min(44, byW, byH))}px`)
        }
        const ro = new ResizeObserver((entries) => entries.forEach((e) => fit(e.target)))
        /** 결과 하나를 피라미드 묶음으로: 획수는 두 방향, LOVES는 하나 */
        function partsOf(m) {
          if (m.kind === 'strokes') return m.readings.map((r, i) => ({ r, letters: r.letters, cap: T.first(m.names[i]) }))
          return [{ r: m.reading, letters: LOVES_HEAD, cap: m.names.join(' LOVES ') }]
        }

        /* ── 계산 화면 ────────────────────────────────────────── */
        const STEP_MS = 240
        let timer = 0
        function analyze() {
          const m = current
          const steps = T.steps[m.kind]
          $('#steps').innerHTML = steps.map((s, i) => `<li><i>${String(i + 1).padStart(2, '0')}</i>${s}</li>`).join('')
          $('#anHint').textContent = T.anHint
          const box = $('#anPyrs')
          box.innerHTML = partsOf(m)
            .map((p) => `<div class="fit"><div><p class="pyr-cap"><span>${esc(p.cap)}</span></p>${pyramid(p.r, p.letters)}</div></div>`)
            .join('')
          Mock.go('analyzing')
          const fits = [...box.querySelectorAll('.fit')]
          requestAnimationFrame(() => fits.forEach((f) => (fit(f), ro.observe(f))))
          /* 줄을 하나씩 연다. 획수는 앞 방향 → 뒤 방향 순서다 */
          const rows = fits.map((f) => [...f.querySelectorAll('.row')])
          const seq = rows.flat()
          seq.forEach((r) => r.classList.add('hide'))
          const lis = [...$('#steps').children]
          /* k번째 줄을 열 때의 단계: 글자 → 획수 → 줄이기 → (순서 바꿔) */
          const stepOf = (k) => (m.kind === 'loves' ? (k === 0 ? 0 : 1) : k >= rows[0].length ? 3 : Math.min(k, 2))
          let k = 0
          clearTimeout(timer)
          const tick = () => {
            if (k >= seq.length) {
              lis.forEach((li) => (li.classList.remove('now'), li.classList.add('done')))
              timer = setTimeout(() => showResult(m), 700)
              return
            }
            const now = stepOf(k)
            lis.forEach((li, i) => {
              li.classList.toggle('now', i === now)
              li.classList.toggle('done', i < now)
            })
            seq[k].classList.remove('hide')
            seq[k].classList.add('show')
            k++
            timer = setTimeout(tick, STEP_MS)
          }
          if (reduced.matches) {
            seq.forEach((r) => r.classList.remove('hide'))
            timer = setTimeout(() => showResult(m), 1400)
          } else timer = setTimeout(tick, 200)
          setTimeout(() => $('#skip').focus({ preventScroll: true }), 50)
        }
        $('#skip').addEventListener('click', () => {
          clearTimeout(timer)
          showResult(current)
        })
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && document.documentElement.dataset.state === 'analyzing') {
            e.preventDefault()
            $('#skip').click()
          }
        })

        /* ── 결과 ─────────────────────────────────────────────── */
        function showResult(m) {
          const scores = $('#scores')
          const proof = $('#proof')
          const [A, B] = m.names
          if (m.kind === 'strokes') {
            const [r0, r1] = m.readings
            scores.innerHTML = [r0, r1]
              .map(
                (r, i) => `<button class="card" type="button" aria-pressed="${i === 0}" data-dir="${i}">
                    <span class="who">${esc(i ? B : A)}<span class="arrow" aria-hidden="true">→</span>${esc(i ? A : B)}</span>
                    <b class="tnum">${r.score}<small>${lang === 'ko' ? '점' : '%'}</small></b>
                  </button>`
              )
              .join('')
            $('#answer').innerHTML = T.answerStrokes(A, B, r0.score, r1.score, bandOf(Math.max(r0.score, r1.score)))
            $('#resNote').textContent = T.resNote.strokes
          } else {
            const r = m.reading
            const endless = r.endless
            scores.innerHTML = `<div class="card ${endless ? 'endless' : ''}"><span class="who">${esc(A)} <span class="arrow">♥</span> ${esc(B)}</span><b class="tnum">${endless ? '∞' : `${r.score}<small>%</small>`}</b></div>`
            $('#answer').innerHTML = endless ? T.answerEndless() : T.answerLoves(A, B, r.score, bandOf(r.score))
            $('#resNote').textContent = endless ? T.resNote.endless : T.resNote.loves
          }
          proof.innerHTML = partsOf(m)
            .map((p) => `<div class="fit"><div><p class="pyr-cap"><span class="label">${T.proofCap[m.kind]}</span><span>${esc(p.cap)}</span></p>${pyramid(p.r, p.letters)}</div></div>`)
            .join('')
          proof.dataset.dir = '0'
          scores.querySelectorAll('.card[data-dir]').forEach((c) =>
            c.addEventListener('click', () => {
              proof.dataset.dir = c.dataset.dir
              scores.querySelectorAll('.card').forEach((x) => x.setAttribute('aria-pressed', String(x === c)))
              proof.querySelectorAll('.fit').forEach(fit)
            })
          )
          Mock.go('result')
          requestAnimationFrame(() => proof.querySelectorAll('.fit').forEach((f) => (fit(f), ro.observe(f))))
        }
        $('#edit').addEventListener('click', () => Mock.go('input'))
        $('#again').addEventListener('click', () => {
          setNames('', '')
          Mock.go('input')
          setTimeout(() => $('#f-a').focus(), 0)
        })

        /* ── 시작 ─────────────────────────────────────────────── */
        update()
        document.fonts?.ready.then(sizeInputs)

        /* ?demo=ko|long|en|endless|slow → 결과, &analyzing → 계산 화면부터, ?demo=input → 이름만 채운 입력 화면 */
        const DEMOS = {
          ko: ['김민준', '박서연'],
          long: ['남궁민수', '제갈윤아'],
          en: ['Alice', 'Bob'],
          endless: ['Steve-O', 'Esmie'],
          slow: ['Declan Donnelly', 'Ashley Roberts'],
        }
        const demo = params.get('demo')
        if (demo !== null) {
          setNames(...(DEMOS[demo] || (lang === 'en' ? DEMOS.en : DEMOS.ko)))
          if (demo === 'input') return
          if (params.has('analyzing')) {
            analyze()
            return
          }
          showResult(current)
        }
      })()
    </script>
  </body>
</html>
