<!doctype html>
<html lang="ko" data-state="input">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="data:," />
    <title>오늘의 운세 · 확정 시안 (문장)</title>
    <link rel="stylesheet" href="./shared/theme.css" />
    <style>
      /* ─── 입력: 한 줄 프롬프트 + 빈칸 문장 ───────────────────── */
      .in {
        display: flex;
        flex-direction: column;
      }
      /* 위에 붙는 띠: 정확도 눈금. 키보드가 올라와도 화면에 남는다 */
      .meter {
        position: sticky;
        top: 0;
        z-index: 5;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas: 'ticks acc';
        gap: 12px 16px;
        align-items: center;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--tile);
      }
      @media (min-width: 640px) {
        .meter {
          padding: 14px 28px;
        }
      }
      @media (min-width: 1024px) {
        .meter {
          grid-template-columns: minmax(0, 1fr) auto auto;
          grid-template-areas: 'ticks acc next';
          gap: 28px;
        }
      }
      .ticks {
        grid-area: ticks;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        max-width: 440px;
        height: 14px;
      }
      .ticks i {
        width: 2px;
        height: 9px;
        background: var(--line-strong);
        transition:
          background-color 500ms,
          height 300ms var(--ease);
      }
      .ticks i:nth-child(5n) {
        height: 14px;
      }
      .ticks i.on {
        background: var(--ink-2);
      }
      .ticks i.new {
        background: var(--brand-hi);
        transition: none;
      }
      .ticks i.next {
        animation: breathe 1.8s ease-in-out infinite alternate;
      }
      @keyframes breathe {
        to {
          background: var(--ink-3);
        }
      }
      .acc {
        grid-area: acc;
        display: flex;
        align-items: baseline;
        gap: 8px;
        justify-self: start;
        font: 500 20px var(--font-mono);
        letter-spacing: -0.02em;
      }
      .acc .label {
        font-size: 11px;
      }
      .acc small {
        font-size: 12px;
        color: var(--ink-3);
      }
      .next {
        grid-area: next;
        display: none;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink-3);
        white-space: nowrap;
      }
      .next b {
        margin-left: 6px;
        font: 500 12px var(--font-mono);
        color: var(--ink-2);
      }
      @media (min-width: 1024px) {
        .next {
          display: block;
        }
      }

      /* 괘선 종이: 문장의 줄 높이에 맞춰 가로줄이 깔린다 */
      .sheet {
        position: relative;
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        gap: 28px;
        padding: 40px 20px 28px;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0 calc(var(--lh, 60px) - 1px),
          rgb(255 255 255 / 0.045) calc(var(--lh, 60px) - 1px) var(--lh, 60px)
        );
        background-position: 0 var(--rule-y, 0px);
      }
      @media (min-width: 640px) {
        .sheet {
          padding: 56px 28px 36px;
        }
      }
      @media (min-width: 1024px) {
        .sheet {
          padding: 48px clamp(28px, 6vw, 104px) 40px;
        }
      }
      .sentence {
        position: relative;
        max-width: 23em;
        font-size: clamp(24px, 4.6vw + 6px, 58px);
        line-height: 1.8;
        font-weight: 700;
        letter-spacing: -0.035em;
        color: var(--ink-2);
      }
      .nowrap {
        white-space: nowrap;
      }
      .blank {
        position: relative;
        display: inline-block;
        margin: 0 0.06em;
        line-height: 1.25;
      }
      .blank > input,
      .blank > button {
        display: inline-block;
        min-width: 1.4em;
        padding: 0 0.05em;
        border-bottom: 2px solid var(--ink-3);
        font-weight: 750;
        line-height: 1.25;
        text-align: center;
        color: var(--ink);
        transition: border-color 200ms;
      }
      .blank > input::placeholder {
        color: var(--ink-3);
      }
      .blank.opt > input,
      .blank.opt > button {
        border-bottom-style: dashed;
        border-bottom-color: rgb(255 255 255 / 0.22);
      }
      .blank > button:not(.set) {
        color: var(--ink-3);
      }
      .blank > input:focus,
      .blank > button:focus-visible,
      .blank > button[aria-expanded='true'] {
        border-bottom-style: solid;
        border-bottom-color: var(--ink);
        outline: none;
      }
      .blank.ok > input,
      .blank.ok > button {
        border-bottom-style: solid;
        border-bottom-color: var(--line-strong);
      }
      /* 빈칸이 더하는 점수가 각주처럼 위에 붙는다 */
      .blank::before {
        content: attr(data-w);
        position: absolute;
        bottom: 100%;
        left: 50%;
        translate: -50% 0;
        margin-bottom: 1px;
        font: 500 10px var(--font-mono);
        letter-spacing: 0.06em;
        line-height: 1;
        white-space: nowrap;
        color: var(--ink-3);
        transition: color 600ms;
      }
      .blank.ok::before {
        color: var(--ink-2);
      }
      .blank.gain::before {
        color: var(--brand-hi);
        transition: none;
      }
      .measure {
        position: absolute;
        visibility: hidden;
        font-weight: 750;
        white-space: pre;
        pointer-events: none;
      }
      /* 고르는 빈칸은 단어 아래 작은 사각 메뉴가 열린다 */
      .menu {
        position: absolute;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        max-width: calc(100% - 16px);
        border: 1px solid var(--line-strong);
        background: var(--canvas);
        animation: menu-in 160ms var(--ease) both;
      }
      @keyframes menu-in {
        from {
          opacity: 0;
          translate: 0 -4px;
        }
      }
      .menu button {
        height: 42px;
        padding: 0 15px;
        font-size: 15px;
        font-weight: 700;
        color: var(--ink-2);
        transition: transform 150ms var(--ease), color 150ms;
      }
      .menu button + button {
        box-shadow: inset 1px 0 var(--line);
      }
      .menu button:hover {
        color: var(--ink);
      }
      .menu button:active {
        transform: scale(0.95);
      }
      .menu button[aria-pressed='true'] {
        background: var(--ink);
        color: var(--canvas);
      }
      .menu button.clear {
        font-size: 13px;
        color: var(--ink-3);
      }
      /* 미리보기는 종이 위 스티커처럼 괘선을 가린다 */
      .preview {
        display: flex;
        align-self: flex-start;
        align-items: baseline;
        gap: 14px;
        max-width: 44em;
        padding: 6px 12px 6px 0;
        background: var(--tile);
        font-size: 16px;
        line-height: 1.55;
        color: var(--ink-2);
      }
      .preview .label {
        flex: none;
      }
      .preview.on #preview {
        color: var(--ink);
      }
      .in-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 20px;
        border-top: 1px solid var(--line);
      }
      @media (min-width: 640px) {
        .in-foot {
          padding: 18px 28px;
        }
      }
      .hint {
        font-size: 14px;
        line-height: 1.5;
        color: var(--ink-3);
      }

      /* ─── 결과: 각주 달린 한 문단 + 여섯 분야 ────────────────── */
      .out {
        container-type: inline-size;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
        padding: 16px 20px 18px;
      }
      @media (min-width: 640px) {
        .out {
          gap: 18px;
          padding: 24px 28px 26px;
        }
      }
      @media (min-width: 1280px) {
        .out {
          padding: 30px clamp(28px, 4vw, 72px) 30px;
        }
      }
      .out-top {
        display: flex;
        flex: none;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 20px;
      }
      .score {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .score b {
        font: 500 clamp(34px, 2.6vw + 18px, 60px) var(--font-mono);
        line-height: 1;
        letter-spacing: -0.05em;
      }
      .score .of {
        font: 500 13px var(--font-mono);
        color: var(--ink-3);
      }
      .who {
        order: 3;
        width: 100%;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink-3);
      }
      @media (min-width: 760px) {
        .who {
          order: 0;
          width: auto;
        }
      }
      .out-top .link {
        margin-left: auto;
      }
      /* 로또로 넘어가는 링크: 문장 고치기보다 앞에, 잉크로 */
      .out-top .to-lotto {
        color: var(--ink);
      }
      .out-top .to-lotto .arrow {
        color: var(--brand-hi);
      }
      .out-top .to-lotto + .link {
        margin-left: 0;
      }
      .answer {
        flex: 1 1 0;
        min-height: 0;
        padding-top: 14px;
        font-size: 30px;
        line-height: 1.6;
        font-weight: 700;
        letter-spacing: -0.035em;
        color: var(--ink-2);
        background: repeating-linear-gradient(
          to bottom,
          transparent 0 calc(1lh - 1px),
          rgb(255 255 255 / 0.04) calc(1lh - 1px) 1lh
        );
        background-position: 0 14px;
        background-clip: content-box;
      }
      .kw {
        --u: rgb(255 255 255 / 0.22);
        position: relative;
        padding-bottom: 0.06em;
        font: inherit;
        color: var(--ink);
        cursor: pointer;
        background:
          linear-gradient(90deg, transparent, var(--ink), transparent) -70% 100% / 0 2px no-repeat,
          linear-gradient(var(--u), var(--u)) 0 100% / 100% 2px no-repeat;
      }
      .kw::before {
        content: attr(data-n);
        position: absolute;
        bottom: 100%;
        left: 0;
        font: 500 max(10px, 0.26em) var(--font-mono);
        line-height: 1;
        letter-spacing: 0;
        color: var(--ink-3);
      }
      .kw:hover,
      .kw[data-hot] {
        --u: var(--ink-2);
      }
      .kw[aria-pressed='true'] {
        --u: var(--ink);
      }
      .kw[aria-pressed='true']::before {
        color: var(--brand-hi);
      }
      .kw:focus-visible {
        outline-offset: 4px;
      }
      .kw.sweep {
        animation: sweep 1.1s var(--ease);
      }
      @keyframes sweep {
        from {
          background-position: -70% 100%, 0 100%;
          background-size: 40% 2px, 100% 2px;
        }
        to {
          background-position: 170% 100%, 0 100%;
          background-size: 40% 2px, 100% 2px;
        }
      }

      /* 여섯 분야: 항상 보이는 가는 트랙 */
      .domains {
        display: grid;
        flex: none;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 8px;
        padding-top: 14px;
        border-top: 1px solid var(--line-strong);
      }
      @media (min-width: 640px) {
        .domains {
          gap: 14px;
        }
      }
      .dom {
        display: grid;
        grid-template-columns: auto auto;
        justify-content: space-between;
        row-gap: 8px;
        padding: 2px 0 4px;
        font-size: 12px;
        font-weight: 700;
        color: var(--ink-3);
        text-align: left;
        transition: color 160ms;
      }
      @media (min-width: 640px) {
        .dom {
          font-size: 13px;
        }
      }
      .dom b {
        font: 500 12px var(--font-mono);
        color: var(--ink-2);
      }
      .dom i {
        grid-column: 1 / -1;
        height: 2px;
        background:
          linear-gradient(var(--ink-2), var(--ink-2)) 0 0 / calc(var(--v) * 1%) 100% no-repeat,
          linear-gradient(var(--line-strong), var(--line-strong)) 0 50% / 100% 1px no-repeat;
        transition: background-size 600ms var(--ease);
      }
      .dom:hover,
      .dom.hl,
      .dom[aria-pressed='true'] {
        color: var(--ink);
      }
      .dom.hl b,
      .dom[aria-pressed='true'] b {
        color: var(--ink);
      }
      .dom.hl i,
      .dom[aria-pressed='true'] i {
        background:
          linear-gradient(var(--brand-hi), var(--brand-hi)) 0 0 / calc(var(--v) * 1%) 100% no-repeat,
          linear-gradient(var(--line-strong), var(--line-strong)) 0 50% / 100% 1px no-repeat;
      }
      .dom:focus-visible {
        outline-offset: 4px;
      }

      /* 각주 띠: 고정(또는 호버)한 말의 뜻 */
      .note {
        display: grid;
        flex: none;
        grid-template-columns: 28px minmax(0, 1fr);
        grid-template-rows: 22px auto;
        align-content: start;
        gap: 8px 14px;
        height: 104px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      .note-idx {
        display: grid;
        place-items: center;
        width: 28px;
        height: 22px;
        border: 1px solid var(--line-strong);
        font: 500 12px var(--font-mono);
        color: var(--brand-hi);
      }
      .note-title {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-width: 0;
        font-size: 15px;
        line-height: 22px;
        white-space: nowrap;
      }
      .note-title b {
        font-weight: 750;
      }
      .note-title span {
        overflow: hidden;
        font-size: 14px;
        font-weight: 600;
        color: var(--ink-3);
        text-overflow: ellipsis;
      }
      .note-text {
        grid-column: 1 / -1;
        font-size: 14px;
        line-height: 1.5;
        color: var(--ink-2);
      }
      .note-viz {
        display: none;
        min-width: 0;
      }
      @container (min-width: 760px) {
        .note {
          grid-template-columns: 28px minmax(0, 1fr) minmax(260px, 36%);
          gap: 8px 18px;
          height: 96px;
        }
        .note-viz {
          display: block;
          grid-column: 3;
          grid-row: 1 / span 2;
          align-self: start;
          height: 64px;
        }
        .note-text {
          grid-column: 2;
          font-size: 15px;
        }
      }
      /* 시각화: 두 시간 단위 계단선 */
      .v-hours {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 4px;
        height: 100%;
      }
      .v-hours svg {
        flex: 1;
        width: 100%;
        min-height: 0;
        overflow: visible;
      }
      .v-hours path {
        fill: none;
        stroke: var(--ink-2);
        stroke-width: 1.5;
        vector-effect: non-scaling-stroke;
      }
      .v-hours .best {
        stroke: var(--brand-hi);
        stroke-width: 2.5;
      }
      .v-hours rect {
        fill: transparent;
        cursor: crosshair;
      }
      .v-hours rect.hot {
        fill: rgb(255 255 255 / 0.06);
      }
      .v-hours .axis {
        display: flex;
        justify-content: space-between;
        font: 500 10px var(--font-mono);
        letter-spacing: 0.06em;
        line-height: 1;
        color: var(--ink-3);
      }
      /* 시각화: 3×3 나침반 */
      .v-dir {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 100%;
      }
      .v-dir .grid {
        display: grid;
        grid-template-columns: repeat(3, 14px);
        gap: 2px;
      }
      .v-dir .grid i {
        height: 14px;
        border: 1px solid var(--line-strong);
      }
      .v-dir .grid i.c {
        border-color: transparent;
        background: linear-gradient(var(--ink-3), var(--ink-3)) 50% 50% / 4px 4px no-repeat;
      }
      .v-dir .grid i.hl {
        border-color: var(--brand-hi);
        background: var(--brand-hi);
      }
      .v-dir .code {
        font: 500 22px var(--font-mono);
        color: var(--ink);
      }
      .v-dir .codes {
        font: 500 11px var(--font-mono);
        letter-spacing: 0.1em;
        color: var(--ink-3);
      }
      /* 시각화: 할 것 · 피할 것 */
      .v-advice {
        display: grid;
        align-content: center;
        gap: 6px;
        height: 100%;
        font-size: 13px;
        line-height: 1.4;
        color: var(--ink-2);
      }
      .v-advice b {
        margin-right: 8px;
        font: 500 10px var(--font-mono);
        letter-spacing: 0.1em;
        color: var(--ink-3);
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <section class="stage" aria-labelledby="game-title">
        <div class="stage-body">
          <!-- ─── 입력 ─── -->
          <form class="view view-input in" id="viewInput" novalidate autocomplete="off">
            <div class="meter" id="meter">
              <span class="ticks idle" id="ticks" aria-hidden="true"></span>
              <span class="acc tnum" role="status" aria-label="정확도"><span class="label">정확도</span><b id="acc" data-v="0">0</b><small>%</small></span>
              <span class="next" id="next"></span>
            </div>

            <div class="sheet" id="sheet">
              <p class="sentence" id="sentence">
                저는
                <span class="nowrap"><span class="blank" data-key="year" data-w="+16"><input id="f-year" inputmode="numeric" maxlength="8" placeholder="0000" aria-label="태어난 해 (필수)" enterkeyhint="next" /></span>년</span>
                <span class="nowrap"><span class="blank" data-key="month" data-w="+12"><input id="f-month" inputmode="numeric" maxlength="2" placeholder="00" aria-label="태어난 달 (필수)" enterkeyhint="next" /></span>월</span>
                <span class="nowrap"><span class="blank" data-key="day" data-w="+12"><input id="f-day" inputmode="numeric" maxlength="2" placeholder="00" aria-label="태어난 날 (필수)" enterkeyhint="next" /></span>일,</span>
                <span class="nowrap"><span class="blank opt" data-key="time" data-w="+24"><input id="f-time" inputmode="numeric" maxlength="5" placeholder="몇 시" aria-label="태어난 시각 (선택, 예: 14:30)" enterkeyhint="next" /></span>에</span>
                <span class="blank opt" data-key="calendar" data-w="+12"><button type="button" id="f-calendar" aria-haspopup="true" aria-expanded="false"></button></span>
                기준으로 태어났어요.
                <span class="nowrap"><span class="blank opt" data-key="gender" data-w="+12"><button type="button" id="f-gender" aria-haspopup="true" aria-expanded="false"></button></span>이고,</span>
                이름은
                <span class="nowrap"><span class="blank opt" data-key="name" data-w="+12"><input id="f-name" maxlength="8" placeholder="이름" aria-label="이름 (선택)" enterkeyhint="done" /></span>이에요.</span>
                <span class="measure" id="measure" aria-hidden="true"></span>
              </p>
              <p class="preview" id="previewRow">
                <span class="label">Preview</span>
                <span id="preview" aria-live="polite"></span>
              </p>
            </div>

            <div class="in-foot">
              <p class="hint">생년월일만 채우면 돼요. 나머지는 채울수록 정확해져요.</p>
              <button class="btn btn-primary" id="go" type="submit" disabled>
                운세 보기 <span class="key" aria-hidden="true">↵</span>
              </button>
            </div>
          </form>

          <!-- ─── 결과 ─── -->
          <div class="view view-result out" id="viewResult">
            <div class="out-top">
              <p class="score"><span class="label">Total</span><b class="tnum" id="total" data-v="0">0</b><span class="of">/100</span></p>
              <p class="who" id="who"></p>
              <a class="link to-lotto" id="toLotto" href="./lotto-stars.html?from=fortune">오늘의 행운 번호 <span class="arrow" aria-hidden="true">→</span></a>
              <button class="link" type="button" id="back"><span class="arrow" aria-hidden="true">←</span>문장 고치기</button>
            </div>
            <p class="answer" id="answer"></p>
            <div class="domains" id="domains" role="group" aria-label="분야별 점수"></div>
            <div class="note" id="note" aria-live="polite">
              <span class="note-idx" id="noteIdx">1</span>
              <p class="note-title" id="noteTitle"></p>
              <div class="note-viz" id="noteViz"></div>
              <p class="note-text" id="noteText"></p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="./shared/chrome.js"></script>
    <script>
      ;(() => {
        const $ = (s) => document.querySelector(s)
        const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`)
        const josa = (word, a, b) => {
          const code = word.charCodeAt(word.length - 1) - 0xac00
          return code >= 0 && code % 28 !== 0 ? a : b
        }
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v))

        /* ── 프로필: 관심 분야는 받지 않는다. 결과에서 여섯 분야를 다 보여 준다 ── */
        const p = { year: '', month: '', day: '', time: '', calendar: '', gender: '', name: '' }
        const PARTS = [
          { key: 'year', label: '태어난 해', weight: 16, ok: () => p.year.length === 4 && +p.year >= 1900 && +p.year <= 2026 },
          { key: 'month', label: '태어난 달', weight: 12, ok: () => +p.month >= 1 && +p.month <= 12 },
          { key: 'day', label: '태어난 날', weight: 12, ok: () => dateValid() },
          { key: 'time', label: '태어난 시각', weight: 24, ok: () => timeValid() },
          { key: 'calendar', label: '양력·음력', weight: 12, ok: () => !!p.calendar },
          { key: 'gender', label: '성별', weight: 12, ok: () => !!p.gender },
          { key: 'name', label: '이름', weight: 12, ok: () => p.name.trim().length >= 1 },
        ]
        const dateValid = () => Mock.validDate(+p.year, +p.month, +p.day) && p.year.length === 4
        const timeValid = () => {
          const m = p.time.match(/^(\d{1,2})(?::(\d{2}))?$/)
          return !!m && +m[1] < 24 && (!m[2] || +m[2] < 60)
        }
        const filled = (key) => PARTS.find((x) => x.key === key).ok()
        const accuracy = () => PARTS.reduce((a, x) => a + (x.ok() ? x.weight : 0), 0)

        const DOMAINS = [
          ['all', '총운'], ['money', '금전'], ['love', '애정'], ['health', '건강'], ['work', '일'], ['rel', '관계'],
        ]
        const LINES = {
          money: ['뜻밖의 작은 수입이 보여요', '쓰는 돈보다 지키는 돈이 눈에 띄어요', '미뤄 둔 정산을 끝내기 좋아요'],
          love: ['먼저 건넨 한마디가 오래 남아요', '말보다 들어 주는 쪽이 나아요', '기대를 내려놓을수록 가벼워져요'],
          health: ['물 한 잔, 스트레칭 한 번', '늦은 밤보다 이른 아침이 편안해요', '어깨의 힘을 빼는 순간이 필요해요'],
          work: ['오후에 집중력이 올라와요', '하나를 끝내고 다음을 시작하세요', '말보다 메모가 오래 남아요'],
          rel: ['말 한마디를 아껴 두세요', '오래 미룬 연락을 오늘 해 보세요', '가까운 사람의 말을 끝까지 들어 보세요'],
        }
        const ADVICE = {
          money: [['영수증을 한 번 정리해요', '충동구매는 하루만 참아요'], ['작은 지출을 적어 둬요', '큰 결제는 내일로']],
          love: [['먼저 안부를 물어요', '늦은 밤 긴 대화'], ['짧게, 자주 말해요', '지난 일 꺼내기']],
          health: [['점심 뒤 10분 걷기', '늦은 밤 카페인'], ['물 두 잔 더', '앉은 채로 두 시간']],
          work: [['오전에 어려운 일부터', '동시에 세 가지'], ['끝낸 일을 적어 둬요', '회의 중 딴 생각']],
          rel: [['고마운 사람에게 한 줄', '단톡방 긴 글'], ['먼저 인사해요', '뒷말 거들기']],
        }
        const HEADLINES = ['한 걸음씩 가도 늦지 않은', '작게 시작해도 멀리 가는', '서두르지 않는 쪽이 이기는', '익숙한 길에서 답을 찾는']
        const SUMMARY = ['크게 벌이기보다 하던 일을 다듬을 때 운이 따라와요.', '오후로 갈수록 흐름이 또렷해져요. 아침은 가볍게 지나보내세요.', '작은 선택 하나가 하루의 방향을 정해요.']
        const DIRS = [['N', '북'], ['NE', '북동'], ['E', '동'], ['SE', '남동'], ['S', '남'], ['SW', '남서'], ['W', '서'], ['NW', '북서']]
        const WORDS = { N: 'NORTH', NE: 'NORTHEAST', E: 'EAST', SE: 'SOUTHEAST', S: 'SOUTH', SW: 'SOUTHWEST', W: 'WEST', NW: 'NORTHWEST' }
        const hourKo = (h) => (h === 0 || h === 24 ? '밤 12시' : h < 12 ? `오전 ${h}시` : h === 12 ? '낮 12시' : `오후 ${h - 12}시`)
        const blockLabel = (i) => `${hourKo(i * 2)}–${hourKo(i * 2 + 2)}`
        const HOUR_NOTES = ['조용히 정리하기 좋은 때', '몸을 깨우는 시간', '시작에 운이 붙어요', '결정을 내리기 좋은 시간', '잠깐 쉬어 가세요', '대화가 잘 풀려요', '집중이 돌아와요', '마무리에 힘이 실려요', '사람을 만나기 좋아요', '가볍게 움직여요', '오늘을 되짚어 보세요', '일찍 쉬는 편이 좋아요']

        function fortune() {
          const hour = timeValid() ? +p.time.split(':')[0] : 0
          const r = Mock.rng(+p.year * 10000 + +p.month * 100 + +p.day + hour * 7 + (p.gender === 'f' ? 3 : 0))
          const domains = DOMAINS.slice(1).map(([key, name]) => ({
            key, name, score: 50 + Math.round(r() * 45),
            line: LINES[key][Math.floor(r() * LINES[key].length)],
            advice: ADVICE[key][Math.floor(r() * ADVICE[key].length)],
          }))
          const total = Math.round(domains.reduce((a, d) => a + d.score, 0) / domains.length)
          const all = { key: 'all', name: '총운', score: total }
          const sorted = [...domains].sort((a, b) => b.score - a.score)
          const hours = []
          let v = total
          for (let i = 0; i < 12; i++) {
            v = clamp(v + Math.round((r() - 0.5) * 24), 35, 96)
            hours.push(v)
          }
          const best = hours.indexOf(Math.max(...hours))
          const dir = DIRS[Math.floor(r() * DIRS.length)]
          return {
            total, domains: [all, ...domains], top: sorted[0], low: sorted[sorted.length - 1],
            headline: HEADLINES[Math.floor(r() * HEADLINES.length)],
            summary: SUMMARY[Math.floor(r() * SUMMARY.length)],
            hours, best, direction: { code: dir[0], name: dir[1] },
            who: p.name.trim() ? `${p.name.trim()} 님` : '',
            accuracy: accuracy(),
          }
        }

        /* ── 빈칸 입력 ── */
        const sheet = $('#sheet'), sentence = $('#sentence'), measure = $('#measure')
        const inputs = { year: $('#f-year'), month: $('#f-month'), day: $('#f-day'), time: $('#f-time'), name: $('#f-name') }
        const picks = { calendar: $('#f-calendar'), gender: $('#f-gender') }
        const OPTIONS = { calendar: [['solar', '양력'], ['lunar', '음력']], gender: [['f', '여성'], ['m', '남성'], ['x', '기타']] }
        const PLACEHOLDER = { calendar: '양력·음력', gender: '성별' }
        const LABEL = { calendar: '양력 또는 음력 (선택)', gender: '성별 (선택)' }

        function sizeInput(input) {
          measure.textContent = input.value || input.placeholder
          const w = Math.ceil(measure.getBoundingClientRect().width)
          input.style.width = `calc(${w}px + 0.1em + 2px)`
        }
        const sizeAll = () => Object.values(inputs).forEach(sizeInput)
        const digits = (v, n) => v.replace(/\D/g, '').slice(0, n)
        /* 년 칸에 8자리를 붙여넣거나 이어서 치면 년·월·일로 나눠 담는다 */
        inputs.year.addEventListener('input', () => {
          const d = inputs.year.value.replace(/\D/g, '')
          if (d.length > 4) {
            p.year = d.slice(0, 4)
            p.month = d.slice(4, 6)
            p.day = d.slice(6, 8)
            inputs.year.value = p.year
            inputs.month.value = p.month
            inputs.day.value = p.day
            sizeInput(inputs.month)
            sizeInput(inputs.day)
            ;(p.day.length === 2 ? inputs.time : p.month.length === 2 ? inputs.day : inputs.month).focus()
            return
          }
          inputs.year.value = p.year = d
          if (p.year.length === 4) inputs.month.focus()
        })
        inputs.year.addEventListener('paste', (e) => {
          const d = (e.clipboardData.getData('text') || '').replace(/\D/g, '')
          if (d.length < 8) return
          e.preventDefault()
          inputs.year.value = d.slice(0, 8)
          inputs.year.dispatchEvent(new Event('input', { bubbles: true }))
        })
        inputs.month.addEventListener('input', () => {
          inputs.month.value = p.month = digits(inputs.month.value, 2)
          if (p.month.length === 2 || +p.month > 1) inputs.day.focus()
        })
        inputs.day.addEventListener('input', () => { inputs.day.value = p.day = digits(inputs.day.value, 2) })
        inputs.time.addEventListener('input', () => {
          const d = digits(inputs.time.value, 4)
          inputs.time.value = p.time = d.length > 2 ? `${d.slice(0, d.length - 2)}:${d.slice(-2)}` : d
        })
        inputs.name.addEventListener('input', () => { p.name = inputs.name.value })
        for (const key of ['month', 'day']) {
          inputs[key].addEventListener('blur', () => {
            if (/^[1-9]$/.test(p[key])) {
              inputs[key].value = p[key] = `0${p[key]}`
              sizeInput(inputs[key])
              update()
            }
          })
        }
        Object.values(inputs).forEach((el) =>
          el.addEventListener('input', () => { sizeInput(el); update() })
        )

        let menu = null
        function closeMenu(refocus) {
          if (!menu) return
          const anchor = menu._anchor
          anchor.setAttribute('aria-expanded', 'false')
          menu.remove()
          menu = null
          if (refocus) anchor.focus()
        }
        function openMenu(key) {
          const anchor = picks[key]
          if (menu && menu._anchor === anchor) return closeMenu(true)
          closeMenu()
          menu = document.createElement('div')
          menu.className = 'menu'
          menu.setAttribute('role', 'group')
          menu.setAttribute('aria-label', LABEL[key])
          menu._anchor = anchor
          for (const [value, label] of OPTIONS[key]) {
            const b = document.createElement('button')
            b.type = 'button'
            b.textContent = label
            b.setAttribute('aria-pressed', String(p[key] === value))
            b.addEventListener('click', () => choose(key, value))
            menu.append(b)
          }
          if (p[key]) {
            const b = document.createElement('button')
            b.type = 'button'
            b.className = 'clear'
            b.textContent = '비우기'
            b.addEventListener('click', () => choose(key, ''))
            menu.append(b)
          }
          sheet.append(menu)
          placeMenu()
          anchor.setAttribute('aria-expanded', 'true')
          ;(menu.querySelector('[aria-pressed="true"]') || menu.firstChild).focus()
        }
        function placeMenu() {
          if (!menu) return
          const a = menu._anchor.getBoundingClientRect(), s = sheet.getBoundingClientRect()
          menu.style.left = `${clamp(a.left - s.left, 8, s.width - menu.offsetWidth - 8)}px`
          menu.style.top = `${a.bottom - s.top + 8}px`
        }
        function choose(key, value) {
          p[key] = value
          closeMenu(true)
          paintPicks()
          update()
        }
        function paintPicks() {
          for (const key of Object.keys(picks)) {
            const opt = OPTIONS[key].find(([v]) => v === p[key])
            picks[key].textContent = opt ? opt[1] : PLACEHOLDER[key]
            picks[key].classList.toggle('set', !!opt)
            picks[key].setAttribute('aria-label', `${LABEL[key]}: ${opt ? opt[1] : '비어 있음'}`)
          }
        }
        Object.entries(picks).forEach(([key, el]) => el.addEventListener('click', () => openMenu(key)))
        document.addEventListener('pointerdown', (e) => {
          if (menu && !menu.contains(e.target) && e.target !== menu._anchor) closeMenu()
        })
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(true) })
        addEventListener('resize', () => { placeMenu(); sizeAll() })

        /* ── 입력에 답하는 것들: 눈금, 숫자, 각주 표시, 미리보기 ── */
        const ticks = $('#ticks')
        ticks.innerHTML = '<i></i>'.repeat(50)
        const tickEls = [...ticks.children]
        let lastLit = 0
        const blanks = [...document.querySelectorAll('.blank')]
        const okBefore = new Set()
        let previewText = ''
        function update() {
          const acc = accuracy()
          const lit = acc / 2
          tickEls.forEach((t, i) => {
            t.classList.toggle('on', i < lit)
            t.classList.toggle('next', i === lit && acc < 100)
            if (i < lit && i >= lastLit && !Mock.reduced.matches) {
              t.classList.add('new')
              setTimeout(() => t.classList.remove('new'), 60 + (i - lastLit) * 18)
            }
          })
          lastLit = lit
          Mock.tween($('#acc'), acc, { ms: 420 })
          for (const b of blanks) {
            const ok = filled(b.dataset.key)
            b.classList.toggle('ok', ok)
            if (ok && !okBefore.has(b.dataset.key) && !Mock.reduced.matches) {
              b.classList.add('gain')
              setTimeout(() => b.classList.remove('gain'), 700)
            }
            ok ? okBefore.add(b.dataset.key) : okBefore.delete(b.dataset.key)
          }
          const missing = PARTS.filter((x) => !x.ok()).sort((a, b) => b.weight - a.weight)[0]
          $('#next').innerHTML = missing ? `다음 · ${missing.label}<b>+${missing.weight}</b>` : '모두 채웠어요'
          $('#go').disabled = !dateValid()
          const text = composePreview()
          $('#previewRow').classList.toggle('on', dateValid())
          if (text !== previewText) {
            previewText = text
            scramble($('#preview'), text)
          }
        }
        function composePreview() {
          if (!filled('year')) return '태어난 해부터 채워 보세요. 오늘의 문장이 여기서 만들어져요.'
          const parts = [`${p.year}년생 ${Mock.zodiac(+p.year)}`]
          if (filled('month') && filled('day')) parts.push(Mock.sign(+p.month, +p.day))
          if (timeValid()) parts.push(`${hourKo(+p.time.split(':')[0])}에 태어남`)
          if (!dateValid()) return `${parts.join(' · ')} …`
          const f = fortune()
          return `${parts.join(' · ')} — ${f.who ? `${f.who}, ` : ''}오늘은 ${f.headline} 날`
        }
        /* 글자 전환: 바뀐 글자가 잠깐 섞였다가 자리를 잡는다 */
        const POOL = '가나다라마바사아자차카타파하0123456789'
        let scrambleRaf = 0
        function scramble(el, text) {
          cancelAnimationFrame(scrambleRaf)
          if (Mock.reduced.matches || Mock.paused()) { el.textContent = text; return }
          const t0 = performance.now()
          const step = (now) => {
            const k = Math.min(1, (now - t0) / 360)
            const n = Math.floor(text.length * k)
            el.textContent = text.slice(0, n) + [...text.slice(n)].map((c) => (c === ' ' ? ' ' : POOL[Math.floor(Math.random() * POOL.length)])).join('')
            if (k < 1) scrambleRaf = requestAnimationFrame(step)
            else el.textContent = text
          }
          scrambleRaf = requestAnimationFrame(step)
        }

        /* ── 결과 ── */
        let f = null
        let pinned = 'k1'
        let shown = ''
        const answer = $('#answer'), domainsEl = $('#domains')
        function render() {
          f = fortune()
          const kw = (n, text) => `<span class="kw" role="button" tabindex="0" data-n="${n}" aria-pressed="false">${esc(text)}</span>`
          const dir = `${f.direction.name}쪽`
          answer.innerHTML =
            `${f.who ? `${esc(f.who)}, ` : ''}오늘은 ${kw(1, f.headline)} 날이에요. ` +
            `${kw(2, blockLabel(f.best))} 무렵 흐름이 가장 좋고, ` +
            `${kw(3, f.top.name)} 쪽 운이 가장 강해요. ` +
            `다만 ${kw(4, f.low.name)}${josa(f.low.name, '은', '는')} 조금 아껴 쓰고, ` +
            `${kw(5, dir)}으로 한 걸음 옮겨 보세요.`
          $('#who').textContent = [
            `${p.year}년생 ${Mock.zodiac(+p.year)}`, Mock.sign(+p.month, +p.day),
            p.calendar === 'lunar' ? '음력' : p.calendar === 'solar' ? '양력' : '', `정확도 ${f.accuracy}%`,
          ].filter(Boolean).join(' · ')
          answer.querySelectorAll('.kw').forEach((el) => {
            const id = 'k' + el.dataset.n
            el.addEventListener('pointerenter', () => showNote(id))
            el.addEventListener('pointerleave', () => showNote(pinned))
            el.addEventListener('focus', () => showNote(id))
            el.addEventListener('blur', () => showNote(pinned))
            el.addEventListener('click', () => pin(id))
            el.addEventListener('keydown', (e) => {
              if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pin(id) }
            })
          })
          domainsEl.innerHTML = f.domains.map((d) =>
            `<button type="button" class="dom" data-k="${d.key}" aria-pressed="false" style="--v:0"><span>${d.name}</span><b class="tnum">${d.score}</b><i></i></button>`
          ).join('')
          domainsEl.querySelectorAll('.dom').forEach((el) => {
            const id = 'd:' + el.dataset.k
            el.addEventListener('pointerenter', () => showNote(id))
            el.addEventListener('pointerleave', () => showNote(pinned))
            el.addEventListener('focus', () => showNote(id))
            el.addEventListener('blur', () => showNote(pinned))
            el.addEventListener('click', () => pin(id))
          })
          shown = ''
          pin('k1')
        }
        function fillTracks() {
          domainsEl.querySelectorAll('.dom').forEach((el) => {
            el.style.setProperty('--v', f.domains.find((d) => d.key === el.dataset.k).score)
          })
        }
        function pin(id) {
          pinned = id
          answer.querySelectorAll('.kw').forEach((el) => el.setAttribute('aria-pressed', String('k' + el.dataset.n === id)))
          domainsEl.querySelectorAll('.dom').forEach((el) => el.setAttribute('aria-pressed', String('d:' + el.dataset.k === id)))
          showNote(id)
        }
        function showNote(id) {
          if (id === shown) return
          shown = id
          answer.querySelectorAll('.kw').forEach((el) => el.toggleAttribute('data-hot', 'k' + el.dataset.n === id))
          const note = noteFor(id)
          domainsEl.querySelectorAll('.dom').forEach((el) => el.classList.toggle('hl', el.dataset.k === note.hl))
          $('#noteIdx').textContent = note.idx
          $('#noteTitle').innerHTML = `<b>${esc(note.title)}</b><span>${esc(note.sub)}</span>`
          $('#noteText').textContent = note.text
          $('#noteViz').innerHTML = note.viz || ''
          if (note.wire) note.wire()
        }
        const vizAdvice = (d) => `<div class="v-advice"><span><b>DO</b>${esc(d.advice[0])}</span><span><b>DON'T</b>${esc(d.advice[1])}</span></div>`
        function vizHours() {
          const w = 240, h = 40
          const y = (v) => h - (v / 100) * h
          let d = `M0 ${y(f.hours[0])}`
          f.hours.forEach((v, i) => { d += ` V${y(v)} H${(i + 1) * 20}` })
          const b = f.best
          const rects = f.hours.map((_, i) => `<rect x="${i * 20}" y="0" width="20" height="${h}" data-i="${i}" />`).join('')
          return `<div class="v-hours"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${rects}<path d="${d}" /><path class="best" d="M${b * 20} ${y(f.hours[b])} H${b * 20 + 20}" /></svg><span class="axis"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></span></div>`
        }
        function vizCompass(dir) {
          const order = ['NW', 'N', 'NE', 'W', '', 'E', 'SW', 'S', 'SE']
          return `<div class="v-dir"><span class="grid">${order.map((c) => `<i class="${c === '' ? 'c' : c === dir.code ? 'hl' : ''}"></i>`).join('')}</span><span class="code">${dir.code}</span><span class="codes">${WORDS[dir.code]}</span></div>`
        }
        function domainNote(key, idx, sub) {
          const d = f.domains.find((x) => x.key === key)
          if (key === 'all') return { idx, hl: 'all', title: `총운 ${d.score}`, sub: `${f.headline} 날`, text: f.summary, viz: '' }
          return { idx, hl: key, title: `${d.name} ${d.score}`, sub, text: `${d.line}. 할 것은 ${d.advice[0]}, 피할 것은 ${d.advice[1]}.`, viz: vizAdvice(d) }
        }
        function noteFor(id) {
          if (id.startsWith('d:')) {
            const key = id.slice(2)
            const rank = f.domains.slice(1).sort((a, b) => b.score - a.score).findIndex((d) => d.key === key)
            return domainNote(key, DOMAINS.findIndex((d) => d[0] === key) + 1 + '', key === 'all' ? '' : key === f.top.key ? '가장 강한 쪽' : key === f.low.key ? '아껴 쓸 쪽' : `${rank + 1}번째로 강해요`)
          }
          const n = +id.slice(1)
          if (n === 1) return domainNote('all', 1)
          if (n === 3) return domainNote(f.top.key, 3, '가장 강한 쪽')
          if (n === 4) return domainNote(f.low.key, 4, '아껴 쓸 쪽')
          if (n === 5) return { idx: 5, hl: '', title: `${f.direction.name}쪽`, sub: '행운의 방향', text: '중요한 약속은 이쪽 자리에서 잡아 보세요.', viz: vizCompass(f.direction) }
          return {
            idx: 2, hl: '', title: blockLabel(f.best), sub: '흐름이 가장 좋은 시간', text: HOUR_NOTES[f.best] + '. 커서로 다른 시간도 훑어 보세요.', viz: vizHours(),
            wire() {
              const svg = document.querySelector('.v-hours svg')
              if (!svg) return
              svg.querySelectorAll('rect').forEach((r) => {
                r.addEventListener('pointerenter', () => {
                  const i = +r.dataset.i
                  svg.querySelectorAll('rect').forEach((x) => x.classList.toggle('hot', x === r))
                  $('#noteTitle').innerHTML = `<b>${blockLabel(i)}</b><span>${f.hours[i]}점</span>`
                  $('#noteText').textContent = HOUR_NOTES[i]
                })
              })
              svg.addEventListener('pointerleave', () => {
                svg.querySelectorAll('rect').forEach((x) => x.classList.remove('hot'))
                $('#noteTitle').innerHTML = `<b>${blockLabel(f.best)}</b><span>흐름이 가장 좋은 시간</span>`
                $('#noteText').textContent = HOUR_NOTES[f.best]
              })
            },
          }
        }
        /* 문단이 남는 높이에 꼭 맞게 글자 크기를 잡는다 */
        function fit() {
          if (document.documentElement.dataset.state !== 'result') return
          let lo = 16, hi = 92
          while (hi - lo > 1) {
            const mid = Math.floor((lo + hi) / 2)
            answer.style.fontSize = mid + 'px'
            if (answer.scrollHeight <= answer.clientHeight + 1) lo = mid
            else hi = mid
          }
          answer.style.fontSize = lo + 'px'
        }
        addEventListener('resize', fit)
        /* 대기 효과: 밑줄 하나씩 빛이 스치며 살아 있음을 알린다 */
        let sweepAt = 0
        Mock.idle(() => {
          if (document.documentElement.dataset.state !== 'result') return
          const kws = [...answer.querySelectorAll('.kw')]
          if (!kws.length || answer.matches(':hover')) return
          const el = kws[sweepAt++ % kws.length]
          el.classList.remove('sweep')
          void el.offsetWidth
          el.classList.add('sweep')
        }, 2600)

        /* ── 흐름 ── */
        function submit() {
          if (!dateValid()) return
          closeMenu()
          if (document.activeElement) document.activeElement.blur()
          render()
          $('#total').dataset.v = 0
          $('#total').textContent = '0'
          Mock.go('result')
        }
        $('#viewInput').addEventListener('submit', (e) => { e.preventDefault(); submit() })
        document.addEventListener('mock:state', (e) => { if (e.detail === 'result') fit() })
        document.addEventListener('mock:settled', (e) => {
          if (e.detail === 'result') {
            fit()
            fillTracks()
            Mock.tween($('#total'), f.total, { ms: 700 })
          }
        })
        $('#back').onclick = () => {
          Mock.go('input')
          setTimeout(sizeAll, 160)
        }
        /* 오늘의 행운 번호: 원국 입력을 로또로 넘긴다. 앱은 메모리로 넘기고, 시안은 페이지가
           바뀌므로 sessionStorage를 쓴다. 어느 로또 시안으로 갈지는 ?lotto=orbit|slip|… */
        const lottoTarget = new URLSearchParams(location.search).get('lotto') || 'stars'
        $('#toLotto').href = `./lotto-${lottoTarget}.html?from=fortune`
        $('#toLotto').addEventListener('click', () => {
          sessionStorage.setItem(
            'unbbal.lotto.profile',
            JSON.stringify({ y: +p.year, m: +p.month, d: +p.day, time: p.time, calendar: p.calendar || 'solar' })
          )
        })

        /* 괘선을 문장의 줄 상자에 맞춘다 */
        function rule() {
          const lh = parseFloat(getComputedStyle(sentence).lineHeight)
          if (!lh) return
          sheet.style.setProperty('--lh', `${lh}px`)
          sheet.style.setProperty('--rule-y', `${sentence.offsetTop % lh}px`)
        }
        const ro = new ResizeObserver(rule)
        ro.observe(sheet)
        ro.observe(sentence)

        paintPicks()
        if (Mock.demo) {
          const D = Mock.DEMO
          Object.assign(p, { year: String(D.y), month: Mock.pad2(D.m), day: Mock.pad2(D.d), time: `${Mock.pad2(D.hour)}:00`, calendar: D.cal, gender: D.sex, name: D.name })
          for (const key of Object.keys(inputs)) inputs[key].value = p[key]
          paintPicks()
          update()
          render()
          Mock.go('result', { instant: true })
          Mock.tween($('#total'), f.total, { ms: 0 })
        } else {
          update()
        }
        sizeAll()
        document.fonts.ready.then(() => { sizeAll(); fit(); rule() })
      })()
    </script>
  </body>
</html>
