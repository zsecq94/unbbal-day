<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <title>01 문장 · 오늘의 운세 시안</title>
    <link rel="stylesheet" href="shared/theme.css" />
    <style>
      /* ─── Input: one sentence with blanks ─────────────────────────── */
      .in {
        display: flex;
        flex: 1;
        flex-direction: column;
      }

      /* Accuracy meter: 50 ticks, 2% each. Sticky so it stays on screen
         while the keyboard is up. */
      .meter {
        position: sticky;
        top: var(--vv-top);
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--tile);
      }
      @media (min-width: 640px) {
        .meter {
          gap: 20px;
          padding: 14px 28px;
        }
      }
      .meter-name {
        flex: none;
        color: var(--ink-2);
        font-size: 13px;
        font-weight: 700;
      }
      .ticks {
        display: flex;
        flex: 1;
        align-items: flex-end;
        justify-content: space-between;
        max-width: 440px;
        height: 14px;
      }
      .ticks i {
        width: 2px;
        height: 9px;
        background: var(--line-strong);
        transition:
          background-color 0.5s,
          height 0.3s var(--ease);
      }
      .ticks i:nth-child(5n) {
        height: 14px;
      }
      .ticks i.on {
        background: var(--ink-2);
      }
      .ticks i.new {
        background: var(--brand-hi);
        transition: none;
      }
      .ticks i.next {
        animation: breathe 1.8s ease-in-out infinite alternate;
      }
      @keyframes breathe {
        to {
          background: var(--ink-3);
        }
      }
      .acc {
        flex: none;
        min-width: 4.2ch;
        font-size: 20px;
        font-weight: 500;
        letter-spacing: -0.02em;
        text-align: right;
      }
      .acc small {
        margin-left: 1px;
        color: var(--ink-3);
        font-size: 12px;
      }
      .meter-next {
        display: none;
        flex: none;
        margin-left: auto;
        color: var(--ink-3);
        font-size: 13px;
        font-weight: 600;
      }
      .meter-next b {
        margin-left: 6px;
        color: var(--ink-2);
        font-family: var(--mono);
        font-weight: 500;
      }
      @media (min-width: 900px) {
        .meter-next {
          display: block;
        }
      }

      .sheet {
        position: relative;
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        gap: 28px;
        padding: 36px 20px 28px;
      }
      @media (min-width: 640px) {
        .sheet {
          padding: 56px 28px 36px;
        }
      }
      @media (min-width: 1024px) {
        .sheet {
          padding: 48px clamp(28px, 6vw, 104px) 40px;
        }
      }

      /* Ruled paper across the whole sheet, one hairline per line of the
         sentence (JS lines the rules up with the sentence's line boxes). */
      .sheet {
        background: repeating-linear-gradient(
          to bottom,
          transparent 0 calc(var(--lh, 60px) - 1px),
          rgb(255 255 255 / 0.045) calc(var(--lh, 60px) - 1px) var(--lh, 60px)
        );
        background-position: 0 var(--rule-y, 0px);
      }
      .sentence {
        position: relative;
        max-width: 23em;
        color: var(--ink-2);
        font-size: clamp(24px, 4.6vw + 6px, 58px);
        font-weight: 700;
        line-height: 1.8;
        letter-spacing: -0.035em;
      }
      .blank {
        position: relative;
        display: inline-block;
        margin: 0 0.06em;
        line-height: 1.25;
      }
      .blank > input,
      .blank > button {
        display: inline-block;
        min-width: 1.4em;
        padding: 0 0.05em;
        border-bottom: 2px solid var(--ink-3);
        color: var(--ink);
        font-weight: 750;
        line-height: 1.25;
        text-align: center;
        transition: border-color 0.2s;
      }
      .blank.opt > input,
      .blank.opt > button {
        border-bottom-style: dashed;
        border-bottom-color: rgb(255 255 255 / 0.22);
      }
      .blank > button:not(.set) {
        color: var(--ink-3);
      }
      .blank > input:focus,
      .blank > button:focus-visible,
      .blank > button[aria-expanded='true'] {
        border-bottom-style: solid;
        border-bottom-color: var(--ink);
        outline: none;
      }
      .blank.ok > input,
      .blank.ok > button {
        border-bottom-style: solid;
        border-bottom-color: var(--line-strong);
      }
      /* The weight each blank adds, sitting above it like a footnote mark. */
      .blank::before {
        content: attr(data-w);
        position: absolute;
        bottom: 100%;
        left: 50%;
        translate: -50% 0;
        margin-bottom: 1px;
        color: var(--ink-3);
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.06em;
        line-height: 1;
        white-space: nowrap;
        transition: color 0.6s;
      }
      .blank.ok::before {
        color: var(--ink-2);
      }
      .blank.gain::before {
        color: var(--brand-hi);
        transition: none;
      }
      .measure {
        position: absolute;
        visibility: hidden;
        font-weight: 750;
        white-space: pre;
        pointer-events: none;
      }

      .menu {
        position: absolute;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        max-width: calc(100% - 16px);
        border: 1px solid var(--line-strong);
        background: var(--canvas);
        animation: menu-in 0.16s var(--ease) both;
      }
      @keyframes menu-in {
        from {
          opacity: 0;
          translate: 0 -4px;
        }
      }
      .menu button {
        height: 42px;
        padding: 0 15px;
        color: var(--ink-2);
        font-size: 15px;
        font-weight: 700;
        transition: transform 0.15s var(--ease);
      }
      .menu button + button {
        box-shadow: inset 1px 0 var(--line);
      }
      @media (hover: hover) {
        .menu button:hover {
          color: var(--ink);
        }
      }
      .menu button:active {
        transform: scale(0.95);
      }
      .menu button[aria-pressed='true'] {
        background: var(--ink);
        color: var(--canvas);
      }
      .menu button.clear {
        color: var(--ink-3);
        font-size: 13px;
      }

      /* Sits on the paper like a sticker, so rules don't run through it. */
      .preview {
        display: flex;
        align-self: flex-start;
        align-items: baseline;
        gap: 14px;
        max-width: 44em;
        padding: 6px 12px 6px 0;
        background: var(--tile);
        color: var(--ink-2);
        font-size: 16px;
        line-height: 1.55;
      }
      .preview .label {
        flex: none;
      }
      .preview.on #preview {
        color: var(--ink);
      }

      .in-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 20px;
        border-top: 1px solid var(--line);
      }
      @media (min-width: 640px) {
        .in-foot {
          padding: 18px 28px;
        }
      }
      .hint {
        color: var(--ink-3);
        font-size: 14px;
        line-height: 1.5;
      }

      /* ─── Result: one paragraph, footnoted ────────────────────────── */
      .out {
        container-type: inline-size;
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 14px;
        min-height: 0;
        padding: 18px 20px 20px;
      }
      @media (min-width: 640px) {
        .out {
          gap: 20px;
          padding: 26px 28px 28px;
        }
      }
      @media (min-width: 1280px) {
        .out {
          padding: 32px clamp(28px, 4vw, 72px) 32px;
        }
      }
      .out-top {
        display: flex;
        flex: none;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 20px;
      }
      .score {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .score b {
        font-family: var(--mono);
        font-size: clamp(34px, 2.6vw + 18px, 60px);
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.05em;
      }
      .score .of {
        color: var(--ink-3);
        font-size: 13px;
      }
      .who-line {
        order: 3;
        width: 100%;
        color: var(--ink-3);
        font-size: 13px;
        font-weight: 600;
      }
      .out-top .btn {
        margin-left: auto;
      }
      @media (min-width: 760px) {
        .who-line {
          order: 0;
          width: auto;
        }
      }

      .answer {
        flex: 1 1 0;
        min-height: 0;
        padding-top: 14px;
        color: var(--ink-2);
        font-size: 30px;
        font-weight: 700;
        line-height: 1.6;
        letter-spacing: -0.035em;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0 calc(1lh - 1px),
          rgb(255 255 255 / 0.04) calc(1lh - 1px) 1lh
        );
        background-position: 0 14px;
        background-clip: content-box;
      }
      .kw {
        --u: rgb(255 255 255 / 0.22);
        position: relative;
        padding-bottom: 0.06em;
        color: var(--ink);
        cursor: pointer;
        background:
          linear-gradient(90deg, transparent, var(--ink), transparent) -70% 100% /
            0 2px no-repeat,
          linear-gradient(var(--u), var(--u)) 0 100% / 100% 2px no-repeat;
      }
      .kw::before {
        content: attr(data-n);
        position: absolute;
        bottom: 100%;
        left: 0;
        color: var(--ink-3);
        font-family: var(--mono);
        font-size: max(10px, 0.26em);
        font-weight: 500;
        letter-spacing: 0;
        line-height: 1;
      }
      @media (hover: hover) {
        .kw:hover {
          --u: var(--ink-2);
        }
      }
      .kw[data-hot] {
        --u: var(--ink-2);
      }
      .kw[aria-pressed='true'] {
        --u: var(--ink);
      }
      .kw[aria-pressed='true']::before {
        color: var(--brand-hi);
      }
      .kw:focus-visible {
        outline-offset: 4px;
      }
      .kw.sweep {
        animation: sweep 1.1s var(--ease);
      }
      @keyframes sweep {
        from {
          background-position:
            -70% 100%,
            0 100%;
          background-size:
            40% 2px,
            100% 2px;
        }
        to {
          background-position:
            170% 100%,
            0 100%;
          background-size:
            40% 2px,
            100% 2px;
        }
      }

      /* Footnote band: what the pinned (or hovered) phrase means. */
      .note {
        display: grid;
        flex: none;
        grid-template-columns: 28px minmax(0, 1fr);
        grid-template-rows: auto 48px auto;
        align-content: start;
        gap: 10px 14px;
        height: 150px;
        padding-top: 14px;
        border-top: 1px solid var(--line-strong);
      }
      .note-idx {
        display: grid;
        place-items: center;
        width: 28px;
        height: 22px;
        border: 1px solid var(--line-strong);
        color: var(--brand-hi);
        font-family: var(--mono);
        font-size: 12px;
      }
      .note-title {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-width: 0;
        font-size: 15px;
        line-height: 22px;
        white-space: nowrap;
      }
      .note-title b {
        font-weight: 750;
      }
      .note-title span {
        overflow: hidden;
        color: var(--ink-3);
        font-size: 14px;
        font-weight: 600;
        text-overflow: ellipsis;
      }
      .note-viz {
        grid-column: 1 / -1;
        min-width: 0;
      }
      .note-text {
        grid-column: 1 / -1;
        color: var(--ink-2);
        font-size: 14px;
        line-height: 1.5;
      }
      @container (min-width: 760px) {
        .note {
          grid-template-columns: 28px minmax(0, 1fr) minmax(280px, 40%);
          grid-template-rows: 22px auto;
          gap: 10px 18px;
          height: 112px;
        }
        .note-viz {
          grid-column: 3;
          grid-row: 1 / span 2;
          align-self: start;
          height: 64px;
        }
        .note-text {
          grid-column: 2;
          font-size: 15px;
        }
      }

      /* Viz: five domains as hairline tracks */
      .v-dom {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
        height: 100%;
        align-content: center;
      }
      .v-dom div {
        display: grid;
        grid-template-columns: auto auto;
        justify-content: space-between;
        row-gap: 9px;
        color: var(--ink-3);
        font-size: 13px;
        font-weight: 700;
      }
      .v-dom b {
        color: var(--ink-2);
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 500;
      }
      .v-dom i {
        grid-column: 1 / -1;
        height: 2px;
        background:
          linear-gradient(var(--ink-2), var(--ink-2)) 0 0 / calc(var(--v) * 1%)
            100% no-repeat,
          linear-gradient(var(--line-strong), var(--line-strong)) 0 50% / 100%
            1px no-repeat;
      }
      .v-dom .hl {
        color: var(--ink);
      }
      .v-dom .hl b {
        color: var(--ink);
      }
      .v-dom .hl i {
        background:
          linear-gradient(var(--brand-hi), var(--brand-hi)) 0 0 /
            calc(var(--v) * 1%) 100% no-repeat,
          linear-gradient(var(--line-strong), var(--line-strong)) 0 50% / 100%
            1px no-repeat;
      }

      /* Viz: twelve two-hour blocks as a stepped line, hoverable */
      .v-hours {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 4px;
        height: 100%;
      }
      .v-hours svg {
        flex: 1;
        width: 100%;
        min-height: 0;
        overflow: visible;
      }
      .v-hours path {
        fill: none;
        stroke: var(--ink-2);
        stroke-width: 1.5;
        vector-effect: non-scaling-stroke;
      }
      .v-hours .best {
        stroke: var(--brand-hi);
        stroke-width: 2.5;
      }
      .v-hours rect {
        fill: transparent;
        cursor: crosshair;
      }
      .v-hours rect.hot {
        fill: rgb(255 255 255 / 0.06);
      }
      .v-hours .axis {
        display: flex;
        justify-content: space-between;
        color: var(--ink-3);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.06em;
        line-height: 1;
      }

      /* Viz: 3×3 compass */
      .v-dir {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 100%;
      }
      .v-dir .grid {
        display: grid;
        grid-template-columns: repeat(3, 14px);
        gap: 2px;
      }
      .v-dir .grid i {
        height: 14px;
        border: 1px solid var(--line-strong);
      }
      .v-dir .grid i.c {
        border-color: transparent;
        background:
          linear-gradient(var(--ink-3), var(--ink-3)) 50% 50% / 4px 4px
          no-repeat;
      }
      .v-dir .grid i.hl {
        border-color: var(--brand-hi);
        background: var(--brand-hi);
      }
      .v-dir .code {
        color: var(--ink);
        font-family: var(--mono);
        font-size: 22px;
        font-weight: 500;
      }
      .v-dir .codes {
        color: var(--ink-3);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.1em;
      }
    </style>
  </head>
  <body data-state="input">
    <main class="frame">
      <header data-chrome="top-bar"></header>
      <section class="stage" aria-labelledby="game-title">
        <span class="stage-frame" aria-hidden="true"></span>
        <header data-chrome="stage-head"></header>

        <div class="stage-body">
          <form id="input" class="in" novalidate autocomplete="off">
            <div class="meter" data-accuracy>
              <span class="meter-name">정확도</span>
              <span class="ticks idle" id="ticks" aria-hidden="true"></span>
              <span class="acc mono" role="status" aria-label="정확도"
                ><b id="acc">00</b><small>%</small></span
              >
              <span class="meter-next" id="next"></span>
            </div>

            <div class="sheet" id="sheet">
              <p class="sentence" id="sentence">
                저는
                <span class="nowrap"
                  ><span class="blank" data-key="year" data-w="+16"
                    ><input
                      id="f-year"
                      inputmode="numeric"
                      maxlength="4"
                      placeholder="0000"
                      aria-label="태어난 해 (필수)"
                      enterkeyhint="next" /></span
                  >년</span
                >
                <span class="nowrap"
                  ><span class="blank" data-key="month" data-w="+12"
                    ><input
                      id="f-month"
                      inputmode="numeric"
                      maxlength="2"
                      placeholder="00"
                      aria-label="태어난 달 (필수)"
                      enterkeyhint="next" /></span
                  >월</span
                >
                <span class="nowrap"
                  ><span class="blank" data-key="day" data-w="+12"
                    ><input
                      id="f-day"
                      inputmode="numeric"
                      maxlength="2"
                      placeholder="00"
                      aria-label="태어난 날 (필수)"
                      enterkeyhint="next" /></span
                  >일,</span
                >
                <span class="nowrap"
                  ><span class="blank opt" data-key="time" data-w="+22"
                    ><input
                      id="f-time"
                      inputmode="numeric"
                      maxlength="5"
                      placeholder="몇 시"
                      aria-label="태어난 시각 (선택, 예: 14:30)"
                      enterkeyhint="next" /></span
                  >에</span
                >
                <span class="blank opt" data-key="calendar" data-w="+8"
                  ><button
                    type="button"
                    id="f-calendar"
                    aria-haspopup="true"
                    aria-expanded="false"
                  ></button
                ></span>
                기준으로 태어났어요.
                <span class="nowrap"
                  ><span class="blank opt" data-key="gender" data-w="+10"
                    ><button
                      type="button"
                      id="f-gender"
                      aria-haspopup="true"
                      aria-expanded="false"
                    ></button></span
                  >이고</span
                >
                이름은
                <span class="nowrap"
                  ><span class="blank opt" data-key="name" data-w="+12"
                    ><input
                      id="f-name"
                      maxlength="8"
                      placeholder="이름"
                      aria-label="이름 (선택)"
                      enterkeyhint="done" /></span
                  >,</span
                >
                요즘은
                <span class="blank opt" data-key="interests" data-w="+8"
                  ><button
                    type="button"
                    id="f-interests"
                    aria-haspopup="true"
                    aria-expanded="false"
                  ></button
                ></span>
                쪽이 궁금해요.
                <span class="measure" id="measure" aria-hidden="true"></span>
              </p>

              <p class="preview" id="preview-row">
                <span class="label">PREVIEW</span>
                <span id="preview" aria-live="polite"></span>
              </p>
            </div>

            <div class="in-foot">
              <p class="hint">
                생년월일만 채우면 돼요. 나머지는 채울수록 정확해져요.
              </p>
              <button class="btn btn-primary" id="go" type="submit" disabled>
                운세 보기 <span class="mono" aria-hidden="true">→</span>
              </button>
            </div>
          </form>

          <div id="result" class="out" hidden>
            <div class="out-top">
              <p class="score">
                <span class="label">TOTAL</span>
                <b id="r-total" data-v="0">00</b>
                <span class="of mono">/100</span>
              </p>
              <p class="who-line" id="r-who"></p>
              <button class="btn" id="edit" type="button">
                <span class="mono" aria-hidden="true">←</span>문장 고치기
              </button>
            </div>
            <p class="answer" id="answer"></p>
            <div class="note" id="note" aria-live="polite">
              <span class="note-idx" id="note-idx">1</span>
              <p class="note-title" id="note-title"></p>
              <div class="note-viz" id="note-viz"></div>
              <p class="note-text" id="note-text"></p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="shared/chrome.js"></script>
    <script src="shared/kit.js"></script>
    <script>
      const $ = (s) => document.querySelector(s)
      const esc = (s) =>
        s.replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`)
      const josa = (word, a, b) => {
        const code = word.charCodeAt(word.length - 1) - 0xac00
        return code >= 0 && code % 28 !== 0 ? a : b
      }

      const p = Kit.emptyProfile()
      const form = $('#input')
      const result = $('#result')
      const sheet = $('#sheet')
      const sentence = $('#sentence')
      const measure = $('#measure')

      /* ─── Input ───────────────────────────────────────────────────── */
      const inputs = {
        year: $('#f-year'),
        month: $('#f-month'),
        day: $('#f-day'),
        time: $('#f-time'),
        name: $('#f-name'),
      }
      const picks = {
        calendar: $('#f-calendar'),
        gender: $('#f-gender'),
        interests: $('#f-interests'),
      }
      const OPTIONS = {
        calendar: [
          ['solar', '양력'],
          ['lunar', '음력'],
        ],
        gender: [
          ['f', '여성'],
          ['m', '남성'],
        ],
        interests: Kit.DOMAINS.map((d) => [d.key, d.name]),
      }
      const PLACEHOLDER = {
        calendar: '양력·음력',
        gender: '성별',
        interests: '관심 분야',
      }
      const LABEL = {
        calendar: '양력 또는 음력 (선택)',
        gender: '성별 (선택)',
        interests: '관심 분야 (선택)',
      }

      const ticks = $('#ticks')
      ticks.innerHTML = '<i></i>'.repeat(50)
      const tickEls = [...ticks.children]
      let lastLit = 0

      function sizeInput(input) {
        measure.textContent = input.value || input.placeholder
        const w = Math.ceil(measure.getBoundingClientRect().width)
        input.style.width = `calc(${w}px + 0.1em + 2px)`
      }
      const sizeAll = () => Object.values(inputs).forEach(sizeInput)

      const digits = (v, n) => v.replace(/\D/g, '').slice(0, n)
      inputs.year.addEventListener('input', () => {
        inputs.year.value = p.year = digits(inputs.year.value, 4)
        if (p.year.length === 4) inputs.month.focus()
      })
      inputs.month.addEventListener('input', () => {
        inputs.month.value = p.month = digits(inputs.month.value, 2)
        if (p.month.length === 2 || +p.month > 1) inputs.day.focus()
      })
      inputs.day.addEventListener('input', () => {
        inputs.day.value = p.day = digits(inputs.day.value, 2)
      })
      inputs.time.addEventListener('input', () => {
        const d = digits(inputs.time.value, 4)
        inputs.time.value = p.time =
          d.length > 2 ? `${d.slice(0, d.length - 2)}:${d.slice(-2)}` : d
      })
      inputs.name.addEventListener('input', () => {
        p.name = inputs.name.value
      })
      for (const key of ['month', 'day']) {
        inputs[key].addEventListener('blur', () => {
          if (/^[1-9]$/.test(p[key])) {
            inputs[key].value = p[key] = `0${p[key]}`
            update()
          }
        })
      }
      Object.values(inputs).forEach((el) =>
        el.addEventListener('input', () => {
          sizeInput(el)
          update()
        })
      )

      /* Pick blanks open a small square menu under the word. */
      let menu = null
      function closeMenu(refocus) {
        if (!menu) return
        const anchor = menu._anchor
        anchor.setAttribute('aria-expanded', 'false')
        menu.remove()
        menu = null
        if (refocus) anchor.focus()
      }
      function openMenu(key) {
        const anchor = picks[key]
        if (menu?._anchor === anchor) return closeMenu(true)
        closeMenu()
        menu = document.createElement('div')
        menu.className = 'menu'
        menu.setAttribute('role', 'group')
        menu.setAttribute('aria-label', LABEL[key])
        menu._anchor = anchor
        const current = key === 'interests' ? p.interests[0] : p[key]
        for (const [value, label] of OPTIONS[key]) {
          const b = document.createElement('button')
          b.type = 'button'
          b.textContent = label
          b.setAttribute('aria-pressed', String(current === value))
          b.addEventListener('click', () => choose(key, value))
          menu.append(b)
        }
        if (current) {
          const b = document.createElement('button')
          b.type = 'button'
          b.className = 'clear'
          b.textContent = '비우기'
          b.addEventListener('click', () => choose(key, ''))
          menu.append(b)
        }
        sheet.append(menu)
        placeMenu()
        anchor.setAttribute('aria-expanded', 'true')
        ;(menu.querySelector('[aria-pressed="true"]') || menu.firstChild).focus()
      }
      function placeMenu() {
        if (!menu) return
        const a = menu._anchor.getBoundingClientRect()
        const s = sheet.getBoundingClientRect()
        const left = Kit.clamp(a.left - s.left, 8, s.width - menu.offsetWidth - 8)
        menu.style.left = `${left}px`
        menu.style.top = `${a.bottom - s.top + 8}px`
      }
      function choose(key, value) {
        if (key === 'interests') p.interests = value ? [value] : []
        else p[key] = value
        closeMenu(true)
        paintPicks()
        update()
      }
      function paintPicks() {
        for (const key of Object.keys(picks)) {
          const value = key === 'interests' ? p.interests[0] : p[key]
          const label = OPTIONS[key].find(([v]) => v === value)?.[1]
          picks[key].textContent = label || PLACEHOLDER[key]
          picks[key].classList.toggle('set', !!label)
          picks[key].setAttribute(
            'aria-label',
            `${LABEL[key]}: ${label || '비어 있음'}`
          )
        }
      }
      Object.entries(picks).forEach(([key, el]) =>
        el.addEventListener('click', () => openMenu(key))
      )
      document.addEventListener('pointerdown', (e) => {
        if (menu && !menu.contains(e.target) && e.target !== menu._anchor)
          closeMenu()
      })
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeMenu(true)
      })
      window.addEventListener('resize', placeMenu)

      /* Everything that answers the inputs: ticks, number, marks, preview. */
      const blanks = [...document.querySelectorAll('.blank')]
      const okBefore = new Set()
      let previewText = ''
      function update() {
        const acc = Kit.accuracy(p)
        const lit = acc / 2
        tickEls.forEach((t, i) => {
          t.classList.toggle('on', i < lit)
          t.classList.toggle('next', i === lit && acc < 100)
          if (i < lit && i >= lastLit && !Kit.reduced()) {
            t.classList.add('new')
            setTimeout(() => t.classList.remove('new'), 60 + (i - lastLit) * 18)
          }
        })
        lastLit = lit
        Kit.tween($('#acc'), acc, { dur: 420 })

        for (const b of blanks) {
          const ok = Kit.filled(p, b.dataset.key)
          b.classList.toggle('ok', ok)
          if (ok && !okBefore.has(b.dataset.key) && !Kit.reduced()) {
            b.classList.add('gain')
            setTimeout(() => b.classList.remove('gain'), 700)
          }
          ok ? okBefore.add(b.dataset.key) : okBefore.delete(b.dataset.key)
        }

        const missing = [...Kit.PARTS]
          .filter((x) => !x.ok(p))
          .sort((a, b) => b.weight - a.weight)[0]
        $('#next').innerHTML = missing
          ? `다음 · ${missing.label}<b>+${missing.weight}</b>`
          : '모두 채웠어요'

        $('#go').disabled = !Kit.dateValid(p)

        const text = composePreview()
        $('#preview-row').classList.toggle('on', Kit.dateValid(p))
        if (text !== previewText) {
          previewText = text
          Kit.scramble($('#preview'), text, { dur: 360 })
        }
      }
      function composePreview() {
        if (!Kit.okYear(p))
          return '태어난 해부터 채워 보세요. 오늘의 문장이 여기서 만들어져요.'
        const parts = [`${p.year}년생 ${Kit.zodiac(p.year)}띠`]
        if (Kit.okMonth(p) && Kit.okDay(p))
          parts.push(Kit.star(+p.month, +p.day))
        if (Kit.okTime(p))
          parts.push(`${Kit.sijin(+p.time.split(':')[0])}에 태어남`)
        if (!Kit.dateValid(p)) return `${parts.join(' · ')} …`
        const f = Kit.fortune(p)
        return `${parts.join(' · ')} — ${f.who ? `${f.who}, ` : ''}오늘은 ${f.headline}`
      }

      /* ─── Result ──────────────────────────────────────────────────── */
      let f = null
      let pinned = 1
      const answer = $('#answer')

      function renderResult() {
        f = Kit.fortune(p)
        const kw = (n, text) =>
          `<span class="kw" role="button" tabindex="0" data-n="${n}" aria-pressed="false">${text}</span>`
        const head = f.headline.replace(/ 날$/, '')
        const dir = `${f.lucky.direction.name}쪽`
        answer.innerHTML =
          `${f.who ? `${esc(f.who)}, ` : ''}오늘은 ${kw(1, head)} 날이에요. ` +
          `${kw(2, f.lucky.time.label)} 무렵 흐름이 가장 좋고, ` +
          `${kw(3, f.top.name)} 쪽 운이 가장 강해요. ` +
          `다만 ${kw(4, f.low.name)}${josa(f.low.name, '은', '는')} 조금 아껴 쓰고, ` +
          `${kw(5, dir)}으로 한 걸음 옮겨 보세요.`
        $('#r-who').textContent = [
          `${p.year}년생 ${Kit.zodiac(p.year)}띠`,
          Kit.star(+p.month, +p.day),
          `정확도 ${f.accuracy}% · ±${f.err}`,
        ].join(' · ')
        const total = $('#r-total')
        total.dataset.v = 0
        total.textContent = '00'
        answer.querySelectorAll('.kw').forEach((el) => {
          const n = +el.dataset.n
          el.addEventListener('pointerenter', () => showNote(n))
          el.addEventListener('pointerleave', () => showNote(pinned))
          el.addEventListener('focus', () => showNote(n))
          el.addEventListener('blur', () => showNote(pinned))
          el.addEventListener('click', () => pin(n))
          el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault()
              pin(n)
            }
          })
        })
        pin(1)
        fit()
      }

      function pin(n) {
        pinned = n
        answer.querySelectorAll('.kw').forEach((el) =>
          el.setAttribute('aria-pressed', String(+el.dataset.n === n))
        )
        showNote(n)
      }

      let shown = 0
      function showNote(n) {
        if (n === shown) return
        shown = n
        answer
          .querySelectorAll('.kw')
          .forEach((el) => el.toggleAttribute('data-hot', +el.dataset.n === n))
        const note = NOTES[n](f)
        $('#note-idx').textContent = n
        $('#note-title').innerHTML = `<b>${note.title}</b><span>${note.sub}</span>`
        $('#note-text').textContent = note.text
        $('#note-viz').innerHTML = note.viz
        note.wire?.()
      }

      const vizDomains = (hl) =>
        `<div class="v-dom">${f.domains
          .map(
            (d) =>
              `<div class="${d.key === hl ? 'hl' : ''}"><span>${d.name}</span><b>${d.score}</b><i style="--v:${d.score}"></i></div>`
          )
          .join('')}</div>`

      function vizHours() {
        const w = 240
        const h = 40
        const y = (v) => h - (v / 100) * h
        let d = `M0 ${y(f.hours[0])}`
        f.hours.forEach((v, i) => {
          d += ` V${y(v)} H${(i + 1) * 20}`
        })
        const b = f.best
        const rects = f.hours
          .map((_, i) => `<rect x="${i * 20}" y="0" width="20" height="${h}" data-i="${i}" />`)
          .join('')
        return `<div class="v-hours"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${rects}<path d="${d}" /><path class="best" d="M${b * 20} ${y(f.hours[b])} H${b * 20 + 20}" /></svg><span class="axis"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></span></div>`
      }

      const WORDS = {
        N: 'NORTH',
        NE: 'NORTHEAST',
        E: 'EAST',
        SE: 'SOUTHEAST',
        S: 'SOUTH',
        SW: 'SOUTHWEST',
        W: 'WEST',
        NW: 'NORTHWEST',
      }
      function vizCompass(dir) {
        const order = ['NW', 'N', 'NE', 'W', '', 'E', 'SW', 'S', 'SE']
        return `<div class="v-dir"><span class="grid">${order
          .map((c) => `<i class="${c === '' ? 'c' : c === dir.code ? 'hl' : ''}"></i>`)
          .join('')}</span><span class="code">${dir.code}</span><span class="codes">${WORDS[dir.code]}</span></div>`
      }

      const NOTES = {
        1: () => ({
          title: `총운 ${f.total}`,
          sub: f.headline,
          text: f.summary,
          viz: vizDomains(),
        }),
        2: () => ({
          title: f.lucky.time.label,
          sub: '흐름이 가장 좋은 시간',
          text: f.hourNotes[f.best],
          viz: vizHours(),
          wire() {
            const svg = document.querySelector('.v-hours svg')
            svg.querySelectorAll('rect').forEach((r) => {
              r.addEventListener('pointerenter', () => {
                const i = +r.dataset.i
                svg.querySelectorAll('rect').forEach((x) => x.classList.toggle('hot', x === r))
                $('#note-title').innerHTML = `<b>${Kit.blockLabel(i)}</b><span>${f.hours[i]}점</span>`
                $('#note-text').textContent = f.hourNotes[i]
              })
            })
            svg.addEventListener('pointerleave', () => {
              svg.querySelectorAll('rect').forEach((x) => x.classList.remove('hot'))
              $('#note-title').innerHTML = `<b>${f.lucky.time.label}</b><span>흐름이 가장 좋은 시간</span>`
              $('#note-text').textContent = f.hourNotes[f.best]
            })
          },
        }),
        3: () => ({
          title: `${f.top.name} ${f.top.score}`,
          sub: '가장 강한 쪽',
          text: `${f.top.line}. ${f.top.advice[0]}.`,
          viz: vizDomains(f.top.key),
        }),
        4: () => ({
          title: `${f.low.name} ${f.low.score}`,
          sub: '아껴 쓸 쪽',
          text: `${f.low.line}. 피할 것은 ${f.low.advice[1]}.`,
          viz: vizDomains(f.low.key),
        }),
        5: () => ({
          title: `${f.lucky.direction.name}쪽`,
          sub: '행운의 방향',
          text: '중요한 약속은 이쪽 자리에서 잡아 보세요.',
          viz: vizCompass(f.lucky.direction),
        }),
      }

      const fit = Kit.fitText(answer, { min: 16, max: 92 })

      /* Idle: one underline at a time catches the light, hinting it's live. */
      let sweepAt = 0
      Kit.idle(() => {
        if (result.hidden) return
        const kws = [...answer.querySelectorAll('.kw')]
        if (!kws.length || answer.matches(':hover')) return
        const el = kws[sweepAt++ % kws.length]
        el.classList.remove('sweep')
        void el.offsetWidth
        el.classList.add('sweep')
      }, 2600)

      /* ─── Flow ────────────────────────────────────────────────────── */
      form.addEventListener('submit', (e) => {
        e.preventDefault()
        if (!Kit.dateValid(p)) return
        closeMenu()
        document.activeElement?.blur()
        shown = 0
        renderResult()
        Kit.swap(form, result, {
          state: 'result',
          after() {
            fit()
            Kit.tween($('#r-total'), f.total, { dur: 700 })
          },
        })
      })
      $('#edit').addEventListener('click', () =>
        Kit.swap(result, form, { state: 'input', after: sizeAll })
      )

      paintPicks()
      if (Kit.demo) {
        Object.assign(p, Kit.SAMPLE, { interests: [...Kit.SAMPLE.interests] })
        for (const key of Object.keys(inputs)) inputs[key].value = p[key]
        paintPicks()
        update()
        form.hidden = true
        result.hidden = false
        document.body.dataset.state = 'result'
        renderResult()
        Kit.tween($('#r-total'), f.total, { dur: 0 })
      } else {
        update()
      }
      sizeAll()
      document.fonts.ready.then(() => {
        sizeAll()
        fit()
      })
      window.addEventListener('resize', sizeAll)

      /* Line the sheet's rules up with the sentence's line boxes. */
      function rule() {
        const lh = parseFloat(getComputedStyle(sentence).lineHeight)
        if (!lh) return
        sheet.style.setProperty('--lh', `${lh}px`)
        sheet.style.setProperty('--rule-y', `${sentence.offsetTop % lh}px`)
      }
      const ruler = new ResizeObserver(rule)
      ruler.observe(sheet)
      ruler.observe(sentence)
      document.fonts.ready.then(rule)
    </script>
  </body>
</html>
