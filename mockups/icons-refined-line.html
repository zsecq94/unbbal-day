    <title>운빨데이 · 게임 아이콘 · 정제한 선</title>

    <link rel="stylesheet" href="./shared/hub.css" />

  </head>
  <body>
    <div class="icon-sheet"></div>

    <script>
      window.ICON_SET = {

          lotto:
            '공 셋은 알맞습니다. 공을 키워 반 칸 타일에서 너무 작던 문제를 풀고, 뽑힌 공 하나만 채웠습니다.',
          match:
            '획수 삼각형은 방식은 맞지만 칸이 작아 헤더에서 덩어리로 뭉칩니다. 겹친 두 원(두 사람)과 채운 교집합(궁합)으로 바꿨습니다.',
          pinball:
            '구슬과 플리퍼는 좋습니다. 뜻 없던 점을 구슬이 떨어지는 길 위로 옮겨 움직임을 읽히게 했습니다.',
          ladder:
            '지금은 진짜 사다리(두 기둥에 가로대)입니다. 사다리 타기는 세로줄 여럿에 가로선이 엇갈리는 놀이라, 그 모양과 도착 칸으로 바꿨습니다.',
          wheel:
            '십자 원판은 과녁처럼도 보입니다. 여섯 칸으로 나누고 위에 바늘을 둬 돌림판으로 읽히게 했습니다.',
          horse:
            '아치(∩)는 문이나 자석으로 읽힙니다. 행운의 상징이기도 한 편자를 바로 세우고(U) 굽 끝과 못 자리를 그려 자석과 구분했습니다. 경마와 운을 함께 담습니다.',
          racing:
